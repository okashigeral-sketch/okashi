<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Okashi — Cozinha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:#f0faf5;height:100vh;display:flex;flex-direction:column;color:#14351f}header{background:#007a35;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:18px}.live{font-size:12px;opacity:.95}.actions{display:flex;gap:6px;align-items:center}.topbtn{background:#fff;color:#007a35;border:0;border-radius:18px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}.status{background:#fff;border-bottom:1px solid #c7ead3;padding:7px 12px;font-size:12px;color:#567;display:flex;justify-content:space-between;gap:8px}.status.ok{color:#007a35}.status.err{color:#b00020;background:#fff2f2}.tabs{display:flex;background:#fff;border-bottom:2px solid #c7ead3}.tab{flex:1;text-align:center;padding:13px 8px;font-size:16px;font-weight:800;color:#999;cursor:pointer;border-bottom:4px solid transparent}.tab.active-new{color:#e03030;background:#fff7f7;border-bottom-color:#e03030}.tab.active-done{color:#007a35;background:#f7fff9;border-bottom-color:#007a35}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;padding:0 7px;border-radius:14px;color:#fff;font-size:13px;margin-left:6px}.content{flex:1;overflow:auto;padding:12px}.card{background:#fff;border:2px solid #e03030;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}.card.done{border-color:#007a35}.cardHead{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:#ffe8e8}.card.done .cardHead{background:#e8fff0}.num{font-size:24px;font-weight:950}.time{font-size:13px;color:#667}.body{padding:12px 14px;border-top:1px solid #eee}.line{font-size:14px;padding:3px 0}.line:first-child{font-size:16px;font-weight:900;color:#111}.nota{margin:0 14px 12px;background:#fff8e0;border-left:4px solid #cc8800;border-radius:0 9px 9px 0;padding:8px 10px;font-size:13px;color:#735000;font-weight:700}.btnReady{width:100%;border:0;background:#007a35;color:#fff;padding:13px;font-size:16px;font-weight:900;cursor:pointer}.empty{text-align:center;padding:60px 20px;color:#8bb99a;font-size:17px;font-weight:700}.alert{display:none;background:#e03030;color:#fff;text-align:center;padding:13px;font-size:17px;font-weight:900}.alert.show{display:block}.small{font-size:11px;color:#789;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🍃 Okashi — Cozinha</h1>
  <div class="actions">
    <button class="topbtn" onclick="fetchOrders()">🔄 Atualizar</button>
    <button class="topbtn" onclick="mostrarTudo()">👁️ Mostrar tudo</button>
    <div class="live" id="live">A ligar...</div>
  </div>
</header>
<div id="status" class="status">A verificar ligação ao Airtable...</div>
<div class="alert" id="alert">🔔 NOVO PEDIDO!</div>
<div class="tabs">
  <div id="tabNew" class="tab active-new" onclick="setTab('Novo')">🔴 Novos <span id="countNew" class="badge" style="background:#e03030">0</span></div>
  <div id="tabDone" class="tab" onclick="setTab('Pronto')">✅ Feitos <span id="countDone" class="badge" style="background:#007a35">0</span></div>
</div>
<div id="content" class="content"><div class="empty">A carregar pedidos...</div></div>
<script>
const TOKEN = 'patxsjHccHr0MqzD4.3c2af2923a6de35efe015937845b6ab4b9d59d81c561c18cb9cc7eb472cdc0bd';
const BASE = 'app1DlNHDekbP5asp';
const TABLE = 'tblQU3C1h4D8mxuqA';

let orders = [];
let activeTab = 'Novo';
let knownIds = new Set();
let firstLoad = true;

function estado(record){
  const e = record.fields.Estado;
  if(!e) return '';
  if(typeof e === 'string') return e.trim();
  return (e.name || '').trim();
}
function hora(v){
  if(!v) return '';
  try { return new Date(v).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; }
}
function linhas(v){ return String(v||'').split('\n').filter(x=>x.trim()); }
function setStatus(msg, ok=true){
  const s=document.getElementById('status');
  s.textContent=msg;
  s.className='status '+(ok?'ok':'err');
}
function setTab(t){
  activeTab=t;
  document.getElementById('tabNew').className='tab '+(t==='Novo'?'active-new':'');
  document.getElementById('tabDone').className='tab '+(t==='Pronto'?'active-done':'');
  render();
}
function mostrarTudo(){
  localStorage.removeItem('ok_inicio');
  setStatus('Filtro “Novo dia” removido. A mostrar todos os pedidos lidos.', true);
  fetchOrders();
}
function render(){
  const novos = orders.filter(o=>estado(o)==='Novo').sort((a,b)=>new Date(a.fields.Hora||0)-new Date(b.fields.Hora||0));
  const feitos = orders.filter(o=>estado(o)==='Pronto').sort((a,b)=>new Date(b.fields.Hora||0)-new Date(a.fields.Hora||0));
  document.getElementById('countNew').textContent=novos.length;
  document.getElementById('countDone').textContent=feitos.length;
  const lista = activeTab==='Novo' ? novos : feitos;
  const c=document.getElementById('content');
  if(!lista.length){
    c.innerHTML='<div class="empty">'+(activeTab==='Novo'?'🍃 Sem pedidos novos':'✅ Sem pedidos feitos')+'<div class="small">Se acabaste de enviar um pedido, carrega em Atualizar e confirma se a caixa mostrou “Pedido enviado”.</div></div>';
    return;
  }
  c.innerHTML=lista.map(o=>{
    const f=o.fields;
    const done = estado(o)==='Pronto';
    return `<div class="card ${done?'done':''}">
      <div class="cardHead"><span class="num">${f.NumeroPedido || 'Pedido'}</span><span class="time">${hora(f.Hora)}</span></div>
      <div class="body">${linhas(f.Itens).map((x,i)=>`<div class="line">${x}</div>`).join('')}</div>
      ${f.Notas?`<div class="nota">📝 ${f.Notas}</div>`:''}
      ${!done?`<button class="btnReady" onclick="marcarPronto('${o.id}')">✅ Marcar como pronto</button>`:''}
    </div>`;
  }).join('');
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [1047,1319,1047].forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type='square';const t=ctx.currentTime+i*.18;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.02);g.gain.linearRampToValueAtTime(0,t+.16);o.start(t);o.stop(t+.2);});
  }catch(e){}
}
async function marcarPronto(id){
  try{
    const r=await fetch(`https://api.airtable.com/v0/${BASE}/${TABLE}/${id}`,{method:'PATCH',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({fields:{Estado:'Pronto'}})});
    if(!r.ok){ const err=await r.text(); setStatus('Erro ao marcar como pronto: '+r.status+' '+err, false); return; }
    const o=orders.find(x=>x.id===id); if(o) o.fields.Estado='Pronto';
    render();
  }catch(e){ setStatus('Erro de ligação ao marcar pronto: '+e.message, false); }
}
async function fetchOrders(){
  try{
    document.getElementById('live').textContent='A atualizar...';
    const url=`https://api.airtable.com/v0/${BASE}/${TABLE}?sort%5B0%5D%5Bfield%5D=Hora&sort%5B0%5D%5Bdirection%5D=desc&maxRecords=100`;
    const r=await fetch(url,{headers:{Authorization:'Bearer '+TOKEN}});
    if(!r.ok){ const err=await r.text(); setStatus('Erro Airtable '+r.status+': '+err, false); document.getElementById('live').textContent='Erro'; return; }
    const data=await r.json();
    const recs=data.records||[];
    const newOnes = recs.filter(x=>!knownIds.has(x.id) && estado(x)==='Novo');
    if(!firstLoad && newOnes.length){
      beep();
      document.getElementById('alert').classList.add('show');
      setTimeout(()=>document.getElementById('alert').classList.remove('show'),3000);
      setTab('Novo');
    }
    recs.forEach(x=>knownIds.add(x.id));
    orders=recs;
    firstLoad=false;
    document.getElementById('live').textContent=new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setStatus('Ligado ao Airtable. Registos lidos: '+recs.length+'. Novos: '+recs.filter(x=>estado(x)==='Novo').length+'. Feitos: '+recs.filter(x=>estado(x)==='Pronto').length+'.', true);
    render();
  }catch(e){
    setStatus('Sem ligação / bloqueado pelo browser: '+e.message, false);
    document.getElementById('live').textContent='Sem ligação';
  }
}
fetchOrders();
setInterval(fetchOrders,7000);
</script>
</body>
</html>
