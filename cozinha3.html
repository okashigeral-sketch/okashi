<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Okashi — Cozinha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0faf5;height:100vh;display:flex;flex-direction:column}
header{background:#007a35;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
h1{font-size:17px;font-weight:800;color:#fff}
.hbtns{display:flex;gap:6px;align-items:center}
.hbtn{background:#fff;border:0;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;color:#007a35}
.live{font-size:11px;color:rgba(255,255,255,.85)}
.status{padding:6px 12px;font-size:12px;background:#fff;border-bottom:1px solid #c7ead3;flex-shrink:0}
.status.ok{color:#007a35}.status.err{color:#b00020;background:#fff2f2}
.tabs{display:flex;background:#fff;border-bottom:2px solid #c7ead3;flex-shrink:0}
.tab{flex:1;text-align:center;padding:12px;font-size:15px;font-weight:800;color:#999;cursor:pointer;border-bottom:3px solid transparent}
.tab.an{color:#e03030;background:#fff7f7;border-bottom-color:#e03030}
.tab.af{color:#007a35;background:#f7fff9;border-bottom-color:#007a35}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:12px;color:#fff;font-size:12px;margin-left:5px}
.content{flex:1;overflow-y:auto;padding:12px}
.card{background:#fff;border:2px solid #e03030;border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card.done{border-color:#007a35}
.card.praia:not(.done){border-color:#0066cc}
.ch{padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start}
.ch.novo{background:#ffe8e8}
.ch.done{background:#e8fff0}
.ch.praia{background:#e0f0ff}
.num{font-size:22px;font-weight:900;color:#111}
.praia-tag{background:#0066cc;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;margin-left:6px}
.times{font-size:12px;color:#555;text-align:right;line-height:1.8}
.times b{font-weight:900}
.entrega{padding:8px 14px;background:#e0f0ff;border-left:4px solid #0066cc;font-size:14px;font-weight:900;color:#003a7a;border-top:1px solid #dde}
.body{padding:10px 14px}
.ablock{background:#f5f5f5;border-radius:8px;padding:8px 10px;margin-bottom:6px;border-left:4px solid #e03030}
.card.done .ablock{border-left-color:#007a35}
.ablock:last-child{margin-bottom:0}
.amain{font-size:16px;font-weight:900;color:#111;margin-bottom:3px}
.anum{font-size:11px;font-weight:800;background:#c2006e;color:#fff;border-radius:8px;padding:1px 6px;margin-right:4px;vertical-align:middle}
.atop{font-size:13px;font-weight:700;color:#333;padding:1px 0}
.atop::before{content:"· "}
.atop.extra{font-weight:900;color:#cc8800}
.nota{padding:6px 14px;background:#fff8e0;border-left:4px solid #cc8800;font-size:13px;color:#735000;font-weight:600;border-top:1px solid #eee}
.naopago{background:#e03030;color:#fff;font-size:16px;font-weight:900;text-align:center;padding:8px;letter-spacing:1px}
.btnReady{width:100%;border:0;background:#007a35;color:#fff;padding:13px;font-size:16px;font-weight:900;cursor:pointer;border-top:1px solid #eee}
.empty{text-align:center;padding:50px 20px;color:#8bb99a;font-size:16px;font-weight:700}
.alert{display:none;background:#e03030;color:#fff;text-align:center;padding:12px;font-size:16px;font-weight:900;flex-shrink:0}
.alert.show{display:block}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;padding:22px;min-width:280px;text-align:center}
.mbox h2{font-size:18px;font-weight:800;color:#007a35;margin-bottom:8px}
.mbox p{font-size:13px;color:#888;margin-bottom:16px}
.mbtns{display:flex;gap:8px}
.mok{flex:1;padding:12px;background:#007a35;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.mno{flex:1;padding:12px;background:none;border:1.5px solid #ddd;border-radius:8px;color:#aaa;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<header>
  <h1>🍃 Okashi — Cozinha</h1>
  <div class="hbtns">
    <button class="hbtn" onclick="fetch_now()">🔄 Atualizar</button>
    <button class="hbtn" onclick="mostrarTudo()">👁️ Tudo</button>
    <button class="hbtn" onclick="abrirND()">🌅 Novo dia</button>
    <span class="live" id="live">A ligar...</span>
  </div>
</header>

<div id="st" class="status">A verificar ligação...</div>
<div class="alert" id="alert">🔔 NOVO PEDIDO!</div>

<div class="tabs">
  <div class="tab an" id="tn" onclick="setTab('n')">🔴 Novos <span class="badge" id="bn" style="background:#e03030">0</span></div>
  <div class="tab" id="tf" onclick="setTab('f')">✅ Feitos <span class="badge" id="bf" style="background:#007a35">0</span></div>
</div>

<div class="content" id="ct"><div class="empty">A carregar...</div></div>

<div class="modal" id="mnd">
  <div class="mbox">
    <h2>🌅 Novo dia</h2>
    <p>Ecrã fica limpo. Dados guardados no Airtable.</p>
    <div class="mbtns">
      <button class="mno" onclick="fecharND()">Cancelar</button>
      <button class="mok" onclick="confirmarND()">Começar</button>
    </div>
  </div>
</div>

<script>
const TK='patxsjHccHr0MqzD4.3c2af2923a6de35efe015937845b6ab4b9d59d81c561c18cb9cc7eb472cdc0bd';
const BA='app1DlNHDekbP5asp';
const TA='tblQU3C1h4D8mxuqA';
const F_FIM='fld4K0OjUMi1s4N63';
const F_TEMPO='fldEgrlDTm6SGWsDT';
const F_PRAIA='fldTYaDYtS1PjIYjj';
const F_ONDE='fldwo12QNCHgPmd1R';
const F_TEL='fldWju4PvnQaAGeps';

let orders=[],tab='n',known=new Set(),first=true,inicio=null,timer=null;

function est(r){const e=r.fields.Estado;if(!e)return'';return typeof e==='string'?e.trim():(e.name||'').trim();}
function hr(v){if(!v)return'';return new Date(v).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});}
function mins(a,b){if(!a||!b)return null;return Math.round((new Date(b)-new Date(a))/60000);}
function hoje(){return new Date().toLocaleDateString('pt-PT',{timeZone:'Europe/Lisbon'});}

function eHoje(r){
  if(!r.fields.Hora)return false;
  return new Date(r.fields.Hora).toLocaleDateString('pt-PT',{timeZone:'Europe/Lisbon'})===hoje();
}

function setTab(t){
  tab=t;
  document.getElementById('tn').className='tab '+(t==='n'?'an':'');
  document.getElementById('tf').className='tab '+(t==='f'?'af':'');
  render();
}

function mostrarTudo(){inicio=null;fetch_now();}
function abrirND(){document.getElementById('mnd').classList.add('show');}
function fecharND(){document.getElementById('mnd').classList.remove('show');}
function confirmarND(){inicio=new Date().toISOString();fecharND();fetch_now();}

function parseItens(txt){
  if(!txt)return[];
  const linhas=txt.split('\n').filter(x=>x.trim());
  const blocos=[];let atual=null;
  for(const l of linhas){
    const linha=l.trim();
    if(!linha.startsWith('+')){
      if(atual)blocos.push(atual);
      const numM=linha.match(/^#(\d+)\s+/);
      const num=numM?parseInt(numM[1]):null;
      const nome=linha.replace(/^#\d+\s+/,'').replace(/\s*\(\+€[\d.]+\)\s*$/,'').trim();
      atual={num,nome,tops:[]};
    }else{
      const top=linha.replace(/^\+\s*/,'').replace(/\s*\(\+€[\d.]+\)\s*$/,'').trim();
      if(atual)atual.tops.push(top);
    }
  }
  if(atual)blocos.push(atual);
  return blocos;
}

function render(){
  const filtrados=orders.filter(o=>eHoje(o)&&(!inicio||(o.fields.Hora||'')>=inicio));
  const novos=filtrados.filter(o=>est(o)==='Novo').sort((a,b)=>new Date(a.fields.Hora||0)-new Date(b.fields.Hora||0));
  const feitos=filtrados.filter(o=>est(o)==='Pronto').sort((a,b)=>new Date(b.fields.Hora||0)-new Date(a.fields.Hora||0));
  document.getElementById('bn').textContent=novos.length;
  document.getElementById('bf').textContent=feitos.length;
  const lista=tab==='n'?novos:feitos;
  const ct=document.getElementById('ct');
  if(!lista.length){ct.innerHTML='<div class="empty">'+(tab==='n'?'🍃 Sem pedidos novos':'✅ Sem pedidos feitos')+'</div>';return;}
  const agora=new Date().toISOString();
  ct.innerHTML=lista.map(o=>{
    const f=o.fields;
    const done=est(o)==='Pronto';
    const ip=f[F_PRAIA]===true;
    const ch=f.Hora,fim=f[F_FIM];
    const tt=fim&&ch?mins(ch,fim):null;
    const te=!done&&ch?mins(ch,agora):null;
    let times='';
    if(ch)times+=`<div>📥 <b>${hr(ch)}</b></div>`;
    if(fim)times+=`<div>✅ <b>${hr(fim)}</b></div>`;
    if(tt!==null)times+=`<div>⏱️ <b>${tt} min</b></div>`;
    else if(te!==null)times+=`<div style="color:#e03030">⏳ <b>${te} min</b></div>`;
    const onde=f[F_ONDE]||'',tel=f[F_TEL]||'';
    let entrega='';
    if(onde||tel){
      const pts=[];if(onde)pts.push('📍 '+onde);if(tel)pts.push('📱 '+tel);
      entrega=`<div class="entrega">${pts.join(' · ')}</div>`;
    }
    const blocos=parseItens(f.Itens);
    const bhtml=blocos.map(b=>`<div class="ablock">
      <div class="amain">${b.num?`<span class="anum">#${b.num}</span>`:''} ${b.nome}</div>
      ${b.tops.map(t=>`<div class="atop ${t.toLowerCase().includes('topping extra')||t.toLowerCase().includes('extra')?'extra':''}">${t}</div>`).join('')}
    </div>`).join('');
    const cardCls=['card',done?'done':'',ip?'praia':''].filter(Boolean).join(' ');
    const chCls='ch '+(done?'done':ip?'praia':'novo');
    return`<div class="${cardCls}">
      <div class="${chCls}">
        <div style="display:flex;align-items:center">
          <span class="num">${f.NumeroPedido||'—'}</span>
          ${ip?'<span class="praia-tag">🏖️ PRAIA</span>':''}
        </div>
        <div class="times">${times}</div>
      </div>
      ${entrega}
      <div class="body">${bhtml||`<div style="font-size:14px;color:#888">${f.Itens||''}</div>`}</div>
      ${f.Notas&&!f.Notas.includes('Pagamento:')?'<div class="naopago">⚠️ NÃO PAGO — COBRAR ⚠️</div>':''}
      ${f.Notas?`<div class="nota">📝 ${f.Notas}</div>`:''}
      ${!done?`<button class="btnReady" onclick="marcar('${o.id}','${ch||''}')">✅ Marcar como pronto</button>`:''}
    </div>`;
  }).join('');
}

async function marcar(id,ch){
  const agora=new Date().toISOString();
  const tempo=ch?mins(ch,agora):null;
  try{
    const fields={Estado:'Pronto',[F_FIM]:agora};
    if(tempo!==null)fields[F_TEMPO]=tempo;
    await fetch(`https://api.airtable.com/v0/${BA}/${TA}/${id}`,{method:'PATCH',headers:{Authorization:'Bearer '+TK,'Content-Type':'application/json'},body:JSON.stringify({fields})});
    const o=orders.find(x=>x.id===id);
    if(o){o.fields.Estado='Pronto';o.fields[F_FIM]=agora;if(tempo!==null)o.fields[F_TEMPO]=tempo;}
    render();
  }catch(e){document.getElementById('st').textContent='Erro: '+e.message;document.getElementById('st').className='status err';}
}

function beep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [1047,1319,1047,1319,1047].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.value=f;
      const t=ctx.currentTime+i*.18;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.02);g.gain.linearRampToValueAtTime(0,t+.16);
      o.start(t);o.stop(t+.2);
    });
  }catch(e){}
}

async function fetch_now(){
  try{
    document.getElementById('live').textContent='A atualizar...';
    const r=await fetch(`https://api.airtable.com/v0/${BA}/${TA}?sort%5B0%5D%5Bfield%5D=Hora&sort%5B0%5D%5Bdirection%5D=desc&maxRecords=100`,{headers:{Authorization:'Bearer '+TK}});
    if(!r.ok){const e=await r.text();document.getElementById('st').textContent='Erro '+r.status;document.getElementById('st').className='status err';document.getElementById('live').textContent='Erro';return;}
    const data=await r.json();
    const recs=data.records||[];
    if(!first){
      const novos=recs.filter(x=>!known.has(x.id)&&est(x)==='Novo'&&eHoje(x));
      if(novos.length){beep();document.getElementById('alert').classList.add('show');setTimeout(()=>document.getElementById('alert').classList.remove('show'),3000);setTab('n');}
    }
    recs.forEach(x=>known.add(x.id));
    orders=recs;first=false;
    const agora=new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('live').textContent=agora;
    const filt=recs.filter(o=>eHoje(o)&&(!inicio||(o.fields.Hora||'')>=inicio));
    const nov=filt.filter(o=>est(o)==='Novo').length;
    const fei=filt.filter(o=>est(o)==='Pronto').length;
    document.getElementById('st').textContent='✅ Ligado. Novos: '+nov+' · Feitos: '+fei+'.';
    document.getElementById('st').className='status ok';
    render();
  }catch(e){
    document.getElementById('st').textContent='Sem ligação: '+e.message;
    document.getElementById('st').className='status err';
    document.getElementById('live').textContent='Sem ligação';
  }
}

fetch_now();
setInterval(fetch_now,7000);
</script>
</body>
</html>
