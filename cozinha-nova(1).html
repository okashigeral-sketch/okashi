<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Okashi Cozinha</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f0faf5; height: 100vh; display: flex; flex-direction: column; }
header { background: #007a35; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-size: 18px; font-weight: 800; color: #fff; }
.live { font-size: 11px; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #7fff7f; animation: p 1.5s infinite; }
@keyframes p { 0%,100%{opacity:1} 50%{opacity:0.3} }
.btn-nd { background: #fff; color: #007a35; border: none; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 800; cursor: pointer; margin-right: 8px; }
.tabs { display: flex; background: #fff; border-bottom: 2px solid #c0e8d0; flex-shrink: 0; }
.tab { flex: 1; padding: 13px; text-align: center; cursor: pointer; font-size: 15px; font-weight: 700; color: #aaa; border-bottom: 3px solid transparent; }
.tab.ativ-n { color: #e03030; border-bottom-color: #e03030; background: #fff8f8; }
.tab.ativ-f { color: #007a35; border-bottom-color: #007a35; background: #f8fff8; }
.bdg { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 800; color: #fff; margin-left: 6px; }
.stats { display: flex; gap: 16px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #c0e8d0; flex-shrink: 0; font-size: 13px; color: #888; }
.stats b { font-weight: 800; }
.content { flex: 1; overflow-y: auto; padding: 12px; }
.card { background: #fff; border-radius: 14px; border: 2px solid; margin-bottom: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
.card.nov { border-color: #e03030; animation: pop .4s; }
.card.fei { border-color: #007a35; }
@keyframes pop { from { transform: scale(.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ch { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
.ch.nov { background: #ffe8e8; }
.ch.fei { background: #e8fff0; }
.cn { font-size: 22px; font-weight: 900; }
.ct { font-size: 12px; color: #999; }
.cb { padding: 10px 14px; border-top: 1px solid #f0f0f0; }
.il { font-size: 13px; color: #444; padding: 2px 0; }
.il.m { font-size: 15px; font-weight: 800; color: #111; }
.nota { margin: 5px 14px 10px; background: #fff8e0; border-left: 4px solid #cc8800; border-radius: 0 8px 8px 0; padding: 7px 10px; font-size: 13px; color: #7a5000; font-weight: 600; }
.ca { padding: 10px 12px; border-top: 1px solid #f0f0f0; }
.bp { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 800; cursor: pointer; background: #007a35; color: #fff; }
.empty { text-align: center; padding: 60px 20px; color: #b0d0b8; font-size: 16px; font-weight: 600; }
.alerta { background: #e03030; color: #fff; text-align: center; padding: 12px; font-size: 16px; font-weight: 800; display: none; flex-shrink: 0; }
.alerta.show { display: block; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
.modal.show { display: flex; }
.mbox { background: #fff; border-radius: 16px; padding: 24px; min-width: 280px; text-align: center; }
.mbox h2 { font-size: 20px; font-weight: 800; color: #007a35; margin-bottom: 8px; }
.mbox p { font-size: 13px; color: #888; margin-bottom: 20px; }
.mbtns { display: flex; gap: 10px; }
.mok { flex: 1; padding: 12px; background: #007a35; border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; }
.mno { flex: 1; padding: 12px; background: none; border: 1.5px solid #ddd; border-radius: 10px; color: #aaa; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>🍃 Okashi — Cozinha</h1>
  <div style="display:flex;align-items:center;">
    <button class="btn-nd" onclick="abrirND()">🌅 Novo dia</button>
    <div class="live"><div class="dot"></div><span id="lt">A ligar...</span></div>
  </div>
</header>

<div class="alerta" id="al">🔔 NOVO PEDIDO!</div>

<div class="tabs">
  <div class="tab ativ-n" id="tn" onclick="setTab('n')">
    🔴 Novos <span class="bdg" id="bn" style="background:#e03030">0</span>
  </div>
  <div class="tab" id="tf" onclick="setTab('f')">
    ✅ Feitos <span class="bdg" id="bf" style="background:#007a35">0</span>
  </div>
</div>

<div class="stats">
  <span>Novos: <b id="sn" style="color:#e03030">0</b></span>
  <span>Feitos: <b id="sf" style="color:#007a35">0</b></span>
</div>

<div class="content" id="ct">
  <div class="empty">A carregar...</div>
</div>

<div class="modal" id="mnd">
  <div class="mbox">
    <h2>🌅 Novo dia</h2>
    <p>Ecrã fica limpo e recomeça do zero.<br>Dados ficam guardados no Airtable.</p>
    <div class="mbtns">
      <button class="mno" onclick="fecharND()">Cancelar</button>
      <button class="mok" onclick="confirmarND()">Começar</button>
    </div>
  </div>
</div>

<script>
const TK = 'patxsjHccHr0MqzD4.3c2af2923a6de35efe015937845b6ab4b9d59d81c561c18cb9cc7eb472cdc0bd';
const BA = 'app1DlNHDekbP5asp';
const TA = 'tblQU3C1h4D8mxuqA';

let orders = [], tab = 'n', known = new Set(), first = true;
let inicio = localStorage.getItem('ok_inicio') || null;

function est(o) {
  const e = o.fields.Estado;
  if (!e) return '';
  return typeof e === 'string' ? e : (e.name || '');
}

function hr(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
}

function items(txt) {
  return txt ? txt.split('\n').filter(l=>l.trim()) : [];
}

function setTab(t) {
  tab = t;
  document.getElementById('tn').className = 'tab ' + (t==='n'?'ativ-n':'');
  document.getElementById('tf').className = 'tab ' + (t==='f'?'ativ-f':'');
  render();
}

function filtrar(os) {
  if (!inicio) return os;
  return os.filter(o => (o.fields.Hora||'') >= inicio);
}

function render() {
  const todos = filtrar(orders);
  const novos = todos.filter(o=>est(o)==='Novo').sort((a,b)=>new Date(a.fields.Hora||0)-new Date(b.fields.Hora||0));
  const feitos = todos.filter(o=>est(o)==='Pronto').sort((a,b)=>new Date(b.fields.Hora||0)-new Date(a.fields.Hora||0));

  document.getElementById('bn').textContent = novos.length;
  document.getElementById('bf').textContent = feitos.length;
  document.getElementById('sn').textContent = novos.length;
  document.getElementById('sf').textContent = feitos.length;

  const lista = tab==='n' ? novos : feitos;
  const c = document.getElementById('ct');

  if (!lista.length) {
    c.innerHTML = '<div class="empty">'+(tab==='n'?'🍃 Sem pedidos novos':'✅ Sem pedidos feitos')+'</div>';
    return;
  }

  c.innerHTML = lista.map(o => {
    const f = o.fields;
    const e = est(o);
    const its = items(f.Itens);
    const ac = tab==='n' ? `<div class="ca"><button class="bp" onclick="pronto('${o.id}')">✅ Marcar como pronto</button></div>` : '';
    return `<div class="card ${tab==='n'?'nov':'fei'}">
      <div class="ch ${tab==='n'?'nov':'fei'}">
        <span class="cn">${f.NumeroPedido||'—'}</span>
        <span class="ct">⏰ ${hr(f.Hora)}</span>
      </div>
      <div class="cb">${its.map((x,i)=>`<div class="il ${i===0?'m':''}">${x}</div>`).join('')}</div>
      ${f.Notas?`<div class="nota">📝 ${f.Notas}</div>`:''}
      ${ac}
    </div>`;
  }).join('');
}

async function pronto(id) {
  try {
    await fetch(`https://api.airtable.com/v0/${BA}/${TA}/${id}`,{
      method:'PATCH',
      headers:{'Authorization':'Bearer '+TK,'Content-Type':'application/json'},
      body:JSON.stringify({fields:{Estado:'Pronto'}})
    });
    const o = orders.find(x=>x.id===id);
    if(o) o.fields.Estado = 'Pronto';
    render();
  } catch(e) {}
}

function alarm() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [1047,1319,1047,1319,1047].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='square';o.frequency.value=f;
      const t=ctx.currentTime+i*0.18;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.4,t+0.02);
      g.gain.setValueAtTime(0.4,t+0.12);g.gain.linearRampToValueAtTime(0,t+0.16);
      o.start(t);o.stop(t+0.2);
    });
  } catch(e) {}
}

function abrirND() { document.getElementById('mnd').classList.add('show'); }
function fecharND() { document.getElementById('mnd').classList.remove('show'); }
function confirmarND() {
  inicio = new Date().toISOString();
  localStorage.setItem('ok_inicio', inicio);
  fecharND();
  setTab('n');
}

async function fetch_orders() {
  try {
    const r = await fetch(`https://api.airtable.com/v0/${BA}/${TA}?sort[0][field]=Hora&sort[0][direction]=asc&maxRecords=200`,
      {headers:{'Authorization':'Bearer '+TK}});
    if (!r.ok) { document.getElementById('lt').textContent='Erro '+r.status; return; }
    const d = await r.json();
    const recs = d.records||[];

    if (!first) {
      const novos = recs.filter(r => {
        if (known.has(r.id)) return false;
        const e = r.fields.Estado;
        const n = typeof e==='string'?e:(e?.name||'');
        return n==='Novo' && (!inicio||(r.fields.Hora||'')>=inicio);
      });
      if (novos.length) {
        alarm();
        const al = document.getElementById('al');
        al.classList.add('show');
        setTimeout(()=>al.classList.remove('show'),3000);
        if (tab!=='n') setTab('n');
      }
    }

    recs.forEach(r=>known.add(r.id));
    orders = recs;
    first = false;
    document.getElementById('lt').textContent = new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    render();
  } catch(e) {
    document.getElementById('lt').textContent = 'Sem ligação';
  }
}

fetch_orders();
setInterval(fetch_orders, 7000);
</script>
</body>
</html>
