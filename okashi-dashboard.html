<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okashi — Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f14; color: #fff; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1a0a2e, #0a1a2e);
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #2a1a40;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  .live-badge { font-size: 12px; color: #80c0ff; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4eff70; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Date tabs */
  .date-tabs {
    display: flex; gap: 8px; padding: 12px 16px;
    background: #0a0a12; border-bottom: 1px solid #1a1a2e; overflow-x: auto;
  }
  .tab {
    padding: 6px 16px; border-radius: 20px; border: 1px solid #2a2a40;
    background: none; color: #8080a0; font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: all 0.15s;
  }
  .tab.active { background: #2a1a50; border-color: #8b00a8; color: #e0a0ff; font-weight: 600; }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 16px; }
  .card {
    border-radius: 12px; padding: 14px 16px;
    border: 1px solid;
  }
  .card-faturacao { background: #0a1e0a; border-color: #1a4a1a; }
  .card-despesas  { background: #1e0a0a; border-color: #4a1a1a; }
  .card-lucro-pos { background: #0a1a0a; border-color: #1a5a1a; }
  .card-lucro-neg { background: #1e0a0a; border-color: #5a1a1a; }
  .card-pedidos   { background: #0a0a1e; border-color: #1a1a4a; }
  .card-media     { background: #1a0a1e; border-color: #3a1a4a; }

  .card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; margin-bottom: 6px; }
  .card-value { font-size: 26px; font-weight: 800; line-height: 1; }
  .card-faturacao .card-value { color: #60ff90; }
  .card-despesas  .card-value { color: #ff6060; }
  .card-lucro-pos .card-value { color: #40ffb0; }
  .card-lucro-neg .card-value { color: #ff4040; }
  .card-pedidos   .card-value { color: #80b0ff; }
  .card-media     .card-value { color: #d0a0ff; }
  .card-sub { font-size: 11px; opacity: 0.5; margin-top: 4px; }

  /* Barra de progresso lucro */
  .lucro-bar-wrap { padding: 0 16px 12px; }
  .lucro-bar-label { font-size: 12px; color: #8080a0; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .lucro-bar-bg { background: #4a1a1a; border-radius: 8px; height: 10px; overflow: hidden; }
  .lucro-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s; background: #1a8a40; }
  .lucro-bar-fill.neg { background: #8a1a1a; }

  /* Duas colunas */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px; }
  @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }

  .panel {
    background: #0a0a14; border: 1px solid #1a1a2e;
    border-radius: 12px; overflow: hidden;
  }
  .panel-head {
    padding: 10px 14px; border-bottom: 1px solid #1a1a2e;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-head.verde { color: #60ff90; }
  .panel-head.vermelho { color: #ff6060; }

  .panel-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; border-bottom: 1px solid #0f0f1e; font-size: 13px;
  }
  .panel-item:last-child { border-bottom: none; }
  .panel-item-name { color: #c0c0e0; flex: 1; }
  .panel-item-time { font-size: 11px; color: #404060; margin-right: 8px; }
  .panel-item-val-green { color: #60ff90; font-weight: 700; }
  .panel-item-val-red   { color: #ff6060; font-weight: 700; }
  .cat-badge {
    font-size: 10px; padding: 2px 7px; border-radius: 10px;
    background: #1a1a30; color: #8080c0; margin-right: 6px;
  }
  .empty-panel { padding: 20px; text-align: center; color: #303050; font-size: 13px; }

  /* Despesas form */
  .despesa-form {
    background: #0a0a14; border: 1px solid #1a1a2e;
    border-radius: 12px; padding: 14px; margin: 0 16px 16px;
  }
  .form-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #8080a0; margin-bottom: 10px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-row input, .form-row select {
    background: #0f0f1e; border: 1px solid #2a2a40; border-radius: 8px;
    color: #fff; font-size: 13px; padding: 7px 10px;
  }
  .form-row input { flex: 1; min-width: 120px; }
  .form-row input::placeholder { color: #404060; }
  .form-row select { min-width: 130px; }
  .form-row select option { background: #0f0f1e; }
  .btn-add {
    padding: 7px 16px; background: #5a0080; border: none; border-radius: 8px;
    color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .btn-add:active { opacity: 0.8; }
  .btn-add:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Gráfico semanal */
  .chart-wrap { padding: 0 16px 16px; }
  .chart-panel { background: #0a0a14; border: 1px solid #1a1a2e; border-radius: 12px; padding: 14px; }
  .chart-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #8080a0; margin-bottom: 12px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bar-pair { display: flex; gap: 2px; align-items: flex-end; width: 100%; justify-content: center; }
  .bar { border-radius: 3px 3px 0 0; min-height: 2px; width: 10px; transition: height 0.4s; }
  .bar-fat { background: #2a6a40; }
  .bar-desp { background: #6a2a2a; }
  .bar-label { font-size: 9px; color: #404060; text-align: center; margin-top: 4px; }
  .legend { display: flex; gap: 14px; margin-top: 10px; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #606080; }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; }

  .spinner { text-align: center; padding: 40px; color: #404060; font-size: 13px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1a4a2a; color: #80ff90; padding: 10px 20px;
    border-radius: 20px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🍇 Okashi — Dashboard</h1>
  <div class="live-badge"><div class="dot"></div><span id="update-time">A carregar...</span></div>
</header>

<!-- Filtro de período -->
<div class="date-tabs">
  <button class="tab active" id="tab-hoje" onclick="setTab('hoje')">Hoje</button>
  <button class="tab" id="tab-semana" onclick="setTab('semana')">Esta semana</button>
  <button class="tab" id="tab-mes" onclick="setTab('mes')">Este mês</button>
  <button class="tab" id="tab-tudo" onclick="setTab('tudo')">Tudo</button>
</div>

<div id="main-content">
  <div class="spinner">A carregar dados...</div>
</div>

<!-- Adicionar despesa -->
<div class="despesa-form">
  <div class="form-title">➕ Adicionar despesa</div>
  <div class="form-row">
    <input type="text" id="d-desc" placeholder="Descrição (ex: Açaí em pó)">
    <input type="number" id="d-valor" placeholder="Valor €" step="0.01" min="0" style="max-width:100px">
    <select id="d-cat">
      <option value="Ingredientes">Ingredientes</option>
      <option value="Embalagens">Embalagens</option>
      <option value="Pessoal">Pessoal</option>
      <option value="Renda">Renda</option>
      <option value="Equipamento">Equipamento</option>
      <option value="Marketing">Marketing</option>
      <option value="Outros">Outros</option>
    </select>
    <input type="date" id="d-data" style="max-width:140px">
    <button class="btn-add" id="btn-add-despesa" onclick="addDespesa()">Guardar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN = 'patmO0sek368PNMKT.6fafae521b0705c64a45a1f4fcfed111baecc9e4910feceeffa2d4914e99e3f3';
const BASE  = 'apphwoJIolURQfghd';
const T_PEDIDOS  = 'tblWHxm3Lw2FwcNJC';
const T_DESPESAS = 'tblRVHg0qJkiBBzOI';

let currentTab = 'hoje';
let allPedidos = [];
let allDespesas = [];

// Set today's date as default
document.getElementById('d-data').value = new Date().toISOString().slice(0,10);

function setTab(tab) {
  currentTab = tab;
  ['hoje','semana','mes','tudo'].forEach(t => document.getElementById('tab-'+t).classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderDashboard();
}

function getRange(tab) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (tab === 'hoje') return { from: today, to: new Date(today.getTime() + 86400000) };
  if (tab === 'semana') {
    const day = today.getDay() || 7;
    const mon = new Date(today); mon.setDate(today.getDate() - day + 1);
    return { from: mon, to: new Date(now.getTime() + 86400000) };
  }
  if (tab === 'mes') {
    return { from: new Date(now.getFullYear(), now.getMonth(), 1), to: new Date(now.getTime() + 86400000) };
  }
  return { from: new Date(0), to: new Date(now.getTime() + 86400000) };
}

function filterByDate(records, dateField, tab) {
  const { from, to } = getRange(tab);
  return records.filter(r => {
    const v = r.fields[dateField];
    if (!v) return false;
    const d = new Date(v);
    return d >= from && d < to;
  });
}

async function fetchAll() {
  const headers = { 'Authorization': 'Bearer ' + TOKEN };
  const [rP, rD] = await Promise.all([
    fetch(`https://api.airtable.com/v0/${BASE}/${T_PEDIDOS}?maxRecords=500&sort[0][field]=Data%2FHora&sort[0][direction]=desc`, { headers }),
    fetch(`https://api.airtable.com/v0/${BASE}/${T_DESPESAS}?maxRecords=500&sort[0][field]=Data&sort[0][direction]=desc`, { headers })
  ]);
  const [dP, dD] = await Promise.all([rP.json(), rD.json()]);
  allPedidos  = dP.records  || [];
  allDespesas = dD.records || [];
  const now = new Date();
  document.getElementById('update-time').textContent = 'Atualizado às ' + now.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  renderDashboard();
}

function renderDashboard() {
  const pedidos  = filterByDate(allPedidos,  'Data/Hora', currentTab);
  const despesas = filterByDate(allDespesas, 'fldEWbX2JRv9Pb5AU', currentTab);

  const faturacao = pedidos.reduce((s, r) => s + (r.fields['Total (€)'] || 0), 0);
  const totalDesp = despesas.reduce((s, r) => s + (r.fields['fldQLC9xVwOAqbxkp'] || r.fields['Valor (€)'] || 0), 0);
  const lucro = faturacao - totalDesp;
  const nPedidos = pedidos.length;
  const mediaP = nPedidos > 0 ? faturacao / nPedidos : 0;
  const margem = faturacao > 0 ? (lucro / faturacao) * 100 : 0;

  // Gráfico últimos 7 dias
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const label = d.toLocaleDateString('pt-PT', {weekday:'short'}).slice(0,3);
    const dStr = d.toISOString().slice(0,10);
    const fat = allPedidos
      .filter(r => (r.fields['Data/Hora'] || '').slice(0,10) === dStr)
      .reduce((s,r) => s + (r.fields['Total (€)'] || 0), 0);
    const desp = allDespesas
      .filter(r => (r.fields['fldEWbX2JRv9Pb5AU'] || r.fields['Data'] || '') === dStr)
      .reduce((s,r) => s + (r.fields['fldQLC9xVwOAqbxkp'] || r.fields['Valor (€)'] || 0), 0);
    days.push({ label, fat, desp });
  }
  const maxVal = Math.max(...days.map(d => Math.max(d.fat, d.desp)), 1);

  const lucroClass = lucro >= 0 ? 'card-lucro-pos' : 'card-lucro-neg';
  const barFillPct = faturacao > 0 ? Math.min(100, Math.max(0, (lucro / faturacao) * 100)) : 0;
  const barNeg = lucro < 0;

  const recentPedidos = pedidos.slice(0, 6);
  const recentDespesas = despesas.slice(0, 6);

  document.getElementById('main-content').innerHTML = `
    <div class="cards">
      <div class="card card-faturacao">
        <div class="card-label">Faturação</div>
        <div class="card-value">€${faturacao.toFixed(2)}</div>
        <div class="card-sub">${nPedidos} pedido${nPedidos !== 1 ? 's' : ''}</div>
      </div>
      <div class="card card-despesas">
        <div class="card-label">Despesas</div>
        <div class="card-value">€${totalDesp.toFixed(2)}</div>
        <div class="card-sub">${despesas.length} lançamento${despesas.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="card ${lucroClass}">
        <div class="card-label">Lucro</div>
        <div class="card-value">${lucro >= 0 ? '' : '-'}€${Math.abs(lucro).toFixed(2)}</div>
        <div class="card-sub">Margem: ${margem.toFixed(1)}%</div>
      </div>
      <div class="card card-pedidos">
        <div class="card-label">Nº pedidos</div>
        <div class="card-value">${nPedidos}</div>
        <div class="card-sub">no período</div>
      </div>
      <div class="card card-media">
        <div class="card-label">Ticket médio</div>
        <div class="card-value">€${mediaP.toFixed(2)}</div>
        <div class="card-sub">por pedido</div>
      </div>
    </div>

    <div class="lucro-bar-wrap">
      <div class="lucro-bar-label">
        <span>Despesas vs Faturação</span>
        <span>${barFillPct.toFixed(0)}% de margem</span>
      </div>
      <div class="lucro-bar-bg">
        <div class="lucro-bar-fill ${barNeg ? 'neg' : ''}" style="width:${Math.min(100,Math.abs(barFillPct))}%"></div>
      </div>
    </div>

    <div class="chart-wrap">
      <div class="chart-panel">
        <div class="chart-title">Últimos 7 dias</div>
        <div class="bar-chart">
          ${days.map(d => `
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar bar-fat" style="height:${Math.round((d.fat/maxVal)*76)}px" title="€${d.fat.toFixed(2)}"></div>
                <div class="bar bar-desp" style="height:${Math.round((d.desp/maxVal)*76)}px" title="€${d.desp.toFixed(2)}"></div>
              </div>
              <div class="bar-label">${d.label}</div>
            </div>`).join('')}
        </div>
        <div class="legend">
          <div class="leg"><div class="leg-dot" style="background:#2a6a40"></div>Faturação</div>
          <div class="leg"><div class="leg-dot" style="background:#6a2a2a"></div>Despesas</div>
        </div>
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-head verde">Últimos pedidos <span>${nPedidos} total</span></div>
        ${recentPedidos.length === 0
          ? '<div class="empty-panel">Sem pedidos no período</div>'
          : recentPedidos.map(r => `
            <div class="panel-item">
              <span class="panel-item-name">${r.fields['Pedido'] || '—'}</span>
              <span class="panel-item-time">${(r.fields['Data/Hora']||'').slice(11,16)}</span>
              <span class="panel-item-val-green">€${(r.fields['Total (€)']||0).toFixed(2)}</span>
            </div>`).join('')}
      </div>
      <div class="panel">
        <div class="panel-head vermelho">Despesas <span>€${totalDesp.toFixed(2)} total</span></div>
        ${recentDespesas.length === 0
          ? '<div class="empty-panel">Sem despesas no período</div>'
          : recentDespesas.map(r => `
            <div class="panel-item">
              <span class="panel-item-name">${r.fields['fldEChgH353R4OROE'] || r.fields['Descricao'] || '—'}</span>
              <span class="cat-badge">${r.fields['fldJ6mHQw7HbvJPcg']?.name || r.fields['Categoria']?.name || ''}</span>
              <span class="panel-item-val-red">€${(r.fields['fldQLC9xVwOAqbxkp'] || r.fields['Valor (€)'] || 0).toFixed(2)}</span>
            </div>`).join('')}
      </div>
    </div>
  `;
}

async function addDespesa() {
  const desc  = document.getElementById('d-desc').value.trim();
  const valor = parseFloat(document.getElementById('d-valor').value);
  const cat   = document.getElementById('d-cat').value;
  const data  = document.getElementById('d-data').value;
  if (!desc || isNaN(valor) || valor <= 0) { showToast('⚠️ Preenche descrição e valor!', true); return; }

  const btn = document.getElementById('btn-add-despesa');
  btn.disabled = true; btn.textContent = 'A guardar...';

  try {
    const resp = await fetch(`https://api.airtable.com/v0/${BASE}/${T_DESPESAS}`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { 'fldEChgH353R4OROE': desc, 'fldQLC9xVwOAqbxkp': valor, 'fldJ6mHQw7HbvJPcg': cat, 'fldEWbX2JRv9Pb5AU': data || new Date().toISOString().slice(0,10) } })
    });
    if (resp.ok) {
      document.getElementById('d-desc').value = '';
      document.getElementById('d-valor').value = '';
      showToast('✅ Despesa guardada!');
      await fetchAll();
    } else {
      showToast('❌ Erro ao guardar', true);
    }
  } catch(e) { showToast('❌ Erro de ligação', true); }

  btn.disabled = false; btn.textContent = 'Guardar';
}

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? '#4a1a1a' : '#1a4a2a';
  t.style.color = err ? '#ff8080' : '#80ff90';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

fetchAll();
setInterval(fetchAll, 30000);
</script>
</body>
</html>
