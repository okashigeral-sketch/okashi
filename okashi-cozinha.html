<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Okashi — Cozinha</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f5fff8; color: #1a1a2e; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

header {
  background: #007a35; padding: 10px 16px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,122,53,0.4); flex-shrink: 0;
}
header h1 { font-size: 17px; font-weight: 800; color: #fff; }
.header-right { display: flex; align-items: center; gap: 10px; }
.live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,0.85); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #7fff7f; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
.btn-novo-dia { background: #fff; color: #007a35; border: none; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 800; cursor: pointer; }

/* TABS */
.tabs { display: flex; background: #fff; border-bottom: 2px solid #e0f0e8; flex-shrink: 0; }
.tab {
  flex: 1; padding: 12px; text-align: center; cursor: pointer;
  font-size: 14px; font-weight: 700; color: #aaa; border-bottom: 3px solid transparent;
  transition: all 0.15s; position: relative;
}
.tab.active { color: #007a35; border-bottom-color: #007a35; }
.tab.active.vermelho { color: #e03030; border-bottom-color: #e03030; }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 800;
  color: #fff; margin-left: 6px; vertical-align: middle;
}
.badge-novo { background: #e03030; }
.badge-pronto { background: #007a35; }

.stats { display: flex; gap: 12px; padding: 7px 14px; background: #fff; border-bottom: 1px solid #e0f0e8; flex-shrink: 0; }
.stat { font-size: 12px; color: #aaa; font-weight: 600; }
.stat span { font-weight: 800; }
.stat-novo span { color: #e03030; }
.stat-pronto span { color: #007a35; }
.stat-total span { color: #333; }

/* CONTEÚDO */
.content { flex: 1; overflow-y: auto; padding: 12px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: #c0e0c0; border-radius: 2px; }

/* CARDS */
.card {
  border-radius: 12px; overflow: hidden;
  border: 2px solid; background: #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}
.card.novo { border-color: #e03030; animation: pop .4s ease; }
.card.pronto { border-color: #007a35; }
@keyframes pop { 0%{transform:scale(.93);opacity:0} 60%{transform:scale(1.02)} 100%{transform:scale(1);opacity:1} }

.card-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
.card-head.novo { background: #ffe8e8; }
.card-head.pronto { background: #e8fff0; }
.card-num { font-size: 22px; font-weight: 900; color: #1a1a2e; }
.card-hora { font-size: 12px; color: #aaa; font-weight: 600; }

.card-body { padding: 10px 14px; border-top: 1px solid #f5f5f5; }
.item-line { font-size: 13px; color: #444; padding: 2px 0; line-height: 1.4; }
.item-line.main { font-size: 15px; font-weight: 800; color: #1a1a2e; }

.card-notas {
  margin: 5px 14px 10px;
  background: #fff8e0; border-left: 4px solid #cc8800;
  border-radius: 0 8px 8px 0; padding: 7px 10px;
  font-size: 13px; color: #7a5000; font-weight: 600;
}

.card-total {
  padding: 7px 14px; border-top: 1px solid #f5f5f5;
  display: flex; justify-content: space-between; align-items: center;
}
.total-lbl { font-size: 11px; color: #aaa; }
.total-amt { font-size: 17px; font-weight: 900; color: #007a35; }

.card-actions { padding: 10px 12px; border-top: 1px solid #f5f5f5; }
.btn-pronto {
  width: 100%; padding: 12px; border-radius: 10px; border: none;
  font-size: 15px; font-weight: 800; cursor: pointer;
  background: #007a35; color: #fff;
  box-shadow: 0 3px 8px rgba(0,122,53,0.3);
}
.btn-pronto:active { opacity: 0.85; transform: scale(0.98); }

.empty { text-align: center; padding: 60px 20px; color: #c0e0c0; font-size: 15px; font-weight: 600; }

/* ALERTA */
.novo-alert {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: #e03030; color: #fff; padding: 14px 28px;
  border-radius: 20px; font-size: 16px; font-weight: 800;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  box-shadow: 0 4px 20px rgba(224,48,48,0.6);
}
.novo-alert.show { opacity: 1; }

/* MODAL */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
.modal-bg.show { display: flex; }
.modal-box { background: #fff; border-radius: 16px; padding: 24px; min-width: 280px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.modal-box h2 { font-size: 20px; font-weight: 800; color: #007a35; margin-bottom: 8px; }
.modal-box p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
.modal-btns { display: flex; gap: 10px; }
.btn-confirmar { flex: 1; padding: 12px; background: #007a35; border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; }
.btn-cancelar { flex: 1; padding: 12px; background: none; border: 1.5px solid #ddd; border-radius: 10px; color: #aaa; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>🍃 Okashi — Cozinha</h1>
  <div class="header-right">
    <button class="btn-novo-dia" onclick="abrirNovoDia()">🌅 Novo dia</button>
    <div class="live"><div class="dot"></div><span id="live-txt">A ligar...</span></div>
  </div>
</header>

<div class="tabs">
  <div class="tab active vermelho" id="tab-novos" onclick="setTab('novos')">
    🔴 Pedidos novos <span class="tab-badge badge-novo" id="badge-novo">0</span>
  </div>
  <div class="tab" id="tab-feitos" onclick="setTab('feitos')">
    ✅ Pedidos feitos <span class="tab-badge badge-pronto" id="badge-pronto">0</span>
  </div>
</div>

<div class="stats">
  <div class="stat stat-novo">Novos: <span id="s-novo">0</span></div>
  <div class="stat stat-pronto">Feitos: <span id="s-pronto">0</span></div>


</div>

<div class="content" id="content"></div>

<div class="novo-alert" id="novo-alert">🔔 NOVO PEDIDO!</div>

<div class="modal-bg" id="modal-novo-dia">
  <div class="modal-box">
    <h2>🌅 Novo dia</h2>
    <p>O ecrã vai ficar limpo e o contador de pedidos recomeça.<br>Todos os dados ficam guardados no Airtable.</p>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-confirmar" onclick="confirmarNovoDia()">Começar novo dia</button>
    </div>
  </div>
</div>

<script>
const TOKEN = 'patxsjHccHr0MqzD4.3c2af2923a6de35efe015937845b6ab4b9d59d81c561c18cb9cc7eb472cdc0bd';
const BASE  = 'app1DlNHDekbP5asp';
const TABLE = 'tblQU3C1h4D8mxuqA';

let allOrders = [];
let knownIds = new Set();
let firstLoad = true;
let tabAtual = 'novos';
let ignorarAntesDe = localStorage.getItem('okashi_cozinha_inicio') || null;

function hora(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
}

function parseItems(txt) {
  if (!txt) return [];
  return txt.split('\n').filter(l => l.trim());
}

function setTab(tab) {
  tabAtual = tab;
  document.getElementById('tab-novos').classList.toggle('active', tab === 'novos');
  document.getElementById('tab-novos').classList.toggle('vermelho', tab === 'novos');
  document.getElementById('tab-feitos').classList.toggle('active', tab === 'feitos');
  render();
}

function filtrarPorDia(orders) {
  if (!ignorarAntesDe) return orders;
  return orders.filter(o => (o.fields.Hora || '') >= ignorarAntesDe);
}

function render() {
  const todosFiltrados = filtrarPorDia(allOrders);
  const novos = todosFiltrados
    .filter(o => o.fields.Estado === 'Novo')
    .sort((a,b) => new Date(a.fields.Hora||0) - new Date(b.fields.Hora||0));
  const prontos = todosFiltrados
    .filter(o => o.fields.Estado === 'Pronto')
    .sort((a,b) => new Date(b.fields.Hora||0) - new Date(a.fields.Hora||0));

  // Badges e stats
  document.getElementById('badge-novo').textContent = novos.length;
  document.getElementById('badge-pronto').textContent = prontos.length;
  document.getElementById('s-novo').textContent = novos.length;
  document.getElementById('s-pronto').textContent = prontos.length;
  const total = todosFiltrados.reduce((s,o) => s + (o.fields.Total||0), 0);
  document.getElementById('s-total').textContent = total.toFixed(2) + '€';

  const lista = tabAtual === 'novos' ? novos : prontos;
  const content = document.getElementById('content');

  if (!lista.length) {
    content.innerHTML = '<div class="empty">' +
      (tabAtual === 'novos' ? '🍃 Sem pedidos novos' : '✅ Sem pedidos feitos ainda') +
      '</div>';
    return;
  }

  content.innerHTML = lista.map(o => {
    const f = o.fields;
    const items = parseItems(f.Itens);
    const total = f.Total ? '€' + Number(f.Total).toFixed(2) : '';
    const tipo = tabAtual === 'novos' ? 'novo' : 'pronto';
    const action = tabAtual === 'novos'
      ? `<div class="card-actions"><button class="btn-pronto" onclick="marcarPronto('${o.id}')">✅ Marcar como pronto</button></div>`
      : '';

    return `<div class="card ${tipo}">
      <div class="card-head ${tipo}">
        <span class="card-num">${f.NumeroPedido || '—'}</span>
        <span class="card-hora">⏰ ${hora(f.Hora)}</span>
      </div>
      <div class="card-body">
        ${items.map((item,i) => `<div class="item-line ${i===0?'main':''}">${item}</div>`).join('')}
      </div>
      ${f.Notas ? `<div class="card-notas">📝 ${f.Notas}</div>` : ''}
      ${total ? `<div class="card-total"><span class="total-lbl">Total</span><span class="total-amt">${total}</span></div>` : ''}
      ${action}
    </div>`;
  }).join('');
}

async function marcarPronto(id) {
  try {
    const resp = await fetch(`https://api.airtable.com/v0/${BASE}/${TABLE}/${id}`, {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { 'Estado': 'Pronto' } })
    });
    if (resp.ok) {
      const o = allOrders.find(x => x.id === id);
      if (o) o.fields.Estado = 'Pronto';
      render();
    }
  } catch(e) { console.error(e); }
}

function playAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = [1047, 1319, 1047, 1319, 1047];
    freqs.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'square'; o.frequency.value = freq;
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.4, t + 0.02);
      g.gain.setValueAtTime(0.4, t + 0.12);
      g.gain.linearRampToValueAtTime(0, t + 0.16);
      o.start(t); o.stop(t + 0.2);
    });
  } catch(e) {}
}

function showNovoAlert() {
  const el = document.getElementById('novo-alert');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function abrirNovoDia() {
  document.getElementById('modal-novo-dia').classList.add('show');
}
function fecharModal() {
  document.getElementById('modal-novo-dia').classList.remove('show');
}
function confirmarNovoDia() {
  ignorarAntesDe = new Date().toISOString();
  localStorage.setItem('okashi_cozinha_inicio', ignorarAntesDe);
  fecharModal();
  setTab('novos');
  render();
}

async function fetchOrders() {
  try {
    const url = `https://api.airtable.com/v0/${BASE}/${TABLE}?sort[0][field]=Hora&sort[0][direction]=asc&maxRecords=200`;
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!resp.ok) { document.getElementById('live-txt').textContent = 'Erro ligação'; return; }
    const data = await resp.json();
    const records = data.records || [];

    if (!firstLoad) {
      const novos = records.filter(r =>
        !knownIds.has(r.id) &&
        r.fields.Estado === 'Novo' &&
        (!ignorarAntesDe || (r.fields.Hora || '') >= ignorarAntesDe)
      );
      if (novos.length) {
        playAlarm();
        showNovoAlert();
        if (tabAtual !== 'novos') setTab('novos');
      }
    }

    records.forEach(r => knownIds.add(r.id));
    allOrders = records;
    firstLoad = false;
    document.getElementById('live-txt').textContent = new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    render();
  } catch(e) {
    document.getElementById('live-txt').textContent = 'Sem ligação';
  }
}

fetchOrders();
setInterval(fetchOrders, 7000);
</script>
</body>
</html>
