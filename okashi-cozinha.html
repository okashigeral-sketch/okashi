<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Okashi — Cozinha</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f5fff8; color: #1a1a2e; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
header { background: #007a35; padding: 10px 16px; height: 52px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,122,53,0.4); flex-shrink: 0; }
header h1 { font-size: 17px; font-weight: 800; color: #fff; }
.header-right { display: flex; align-items: center; gap: 10px; }
.live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,0.85); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #7fff7f; animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.btn-nd { background: #fff; color: #007a35; border: none; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 800; cursor: pointer; }
.tabs { display: flex; background: #fff; border-bottom: 2px solid #e0f0e8; flex-shrink: 0; }
.tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 700; color: #aaa; border-bottom: 3px solid transparent; transition: all 0.15s; }
.tab.ativo-nov { color: #e03030; border-bottom-color: #e03030; background: #fff8f8; }
.tab.ativo-fei { color: #007a35; border-bottom-color: #007a35; background: #f8fff8; }
.badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; color: #fff; margin-left: 6px; vertical-align: middle; }
.stats { display: flex; gap: 12px; padding: 8px 14px; background: #fff; border-bottom: 1px solid #e0f0e8; flex-shrink: 0; }
.stat { font-size: 13px; color: #aaa; font-weight: 600; }
.stat b { font-weight: 800; }
.content { flex: 1; overflow-y: auto; padding: 12px; }
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: #c0e0c0; border-radius: 2px; }
.card { background: #fff; border-radius: 14px; border: 2px solid; margin-bottom: 12px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
.card.novo { border-color: #e03030; animation: pop .4s ease; }
.card.pronto { border-color: #007a35; }
@keyframes pop { 0%{transform:scale(.93);opacity:0} 60%{transform:scale(1.02)} 100%{transform:scale(1);opacity:1} }
.card-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
.card-head.novo { background: #ffe8e8; }
.card-head.pronto { background: #e8fff0; }
.card-num { font-size: 22px; font-weight: 900; color: #1a1a2e; }
.card-hora { font-size: 12px; color: #aaa; font-weight: 600; }
.card-body { padding: 10px 14px; border-top: 1px solid #f0f0f0; }
.item-line { font-size: 13px; color: #444; padding: 2px 0; line-height: 1.4; }
.item-line.main { font-size: 15px; font-weight: 800; color: #1a1a2e; }
.card-nota { margin: 5px 14px 10px; background: #fff8e0; border-left: 4px solid #cc8800; border-radius: 0 8px 8px 0; padding: 7px 10px; font-size: 13px; color: #7a5000; font-weight: 600; }
.card-action { padding: 10px 12px; border-top: 1px solid #f0f0f0; }
.btn-pronto { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 800; cursor: pointer; background: #007a35; color: #fff; box-shadow: 0 3px 8px rgba(0,122,53,0.3); }
.btn-pronto:active { opacity: 0.85; }
.empty { text-align: center; padding: 60px 20px; color: #c0e0c0; font-size: 15px; font-weight: 600; }
.novo-alert { background: #e03030; color: #fff; text-align: center; padding: 12px; font-size: 16px; font-weight: 800; display: none; flex-shrink: 0; }
.novo-alert.show { display: block; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
.modal-bg.show { display: flex; }
.modal-box { background: #fff; border-radius: 16px; padding: 24px; min-width: 280px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.modal-box h2 { font-size: 20px; font-weight: 800; color: #007a35; margin-bottom: 8px; }
.modal-box p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
.modal-btns { display: flex; gap: 10px; }
.btn-conf { flex: 1; padding: 12px; background: #007a35; border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; }
.btn-canc { flex: 1; padding: 12px; background: none; border: 1.5px solid #ddd; border-radius: 10px; color: #aaa; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>🍃 Okashi — Cozinha</h1>
  <div class="header-right">
    <button class="btn-nd" onclick="abrirNovoDia()">🌅 Novo dia</button>
    <div class="live"><div class="dot"></div><span id="live-txt">A ligar...</span></div>
  </div>
</header>

<div class="novo-alert" id="alerta">🔔 NOVO PEDIDO!</div>

<div class="tabs">
  <div class="tab ativo-nov" id="tab-nov" onclick="setTab('novos')">
    🔴 Pedidos novos <span class="badge" id="b-nov" style="background:#e03030">0</span>
  </div>
  <div class="tab" id="tab-fei" onclick="setTab('feitos')">
    ✅ Pedidos feitos <span class="badge" id="b-fei" style="background:#007a35">0</span>
  </div>
</div>

<div class="stats">
  <div class="stat">Novos: <b id="s-nov" style="color:#e03030">0</b></div>
  <div class="stat">Feitos: <b id="s-fei" style="color:#007a35">0</b></div>
</div>

<div class="content" id="content">
  <div class="empty">A carregar pedidos...</div>
</div>

<div class="modal-bg" id="modal-nd">
  <div class="modal-box">
    <h2>🌅 Novo dia</h2>
    <p>O ecrã vai ficar limpo e começar do zero.<br>Todos os dados ficam guardados no Airtable.</p>
    <div class="modal-btns">
      <button class="btn-canc" onclick="fecharModal()">Cancelar</button>
      <button class="btn-conf" onclick="confirmarNovoDia()">Começar novo dia</button>
    </div>
  </div>
</div>

<script>
const TOKEN = 'patxsjHccHr0MqzD4.3c2af2923a6de35efe015937845b6ab4b9d59d81c561c18cb9cc7eb472cdc0bd';
const BASE  = 'app1DlNHDekbP5asp';
const TABLE = 'tblQU3C1h4D8mxuqA';

let orders = [];
let tab = 'novos';
let knownIds = new Set();
let firstLoad = true;
let inicioDia = localStorage.getItem('okashi_inicio') || null;

function getEstado(o) {
  const e = o.fields.Estado;
  if (!e) return '';
  if (typeof e === 'string') return e;
  return e.name || '';
}

function hora(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'});
}

function parseItems(txt) {
  if (!txt) return [];
  return txt.split('\n').filter(l => l.trim());
}

function setTab(t) {
  tab = t;
  document.getElementById('tab-nov').className = 'tab ' + (t==='novos' ? 'ativo-nov' : '');
  document.getElementById('tab-fei').className = 'tab ' + (t==='feitos' ? 'ativo-fei' : '');
  render();
}

function filtrar(lista) {
  if (!inicioDia) return lista;
  return lista.filter(o => (o.fields.Hora || '') >= inicioDia);
}

function render() {
  const todos = filtrar(orders);
  const novos = todos.filter(o => getEstado(o) === 'Novo').sort((a,b) => new Date(a.fields.Hora||0) - new Date(b.fields.Hora||0));
  const feitos = todos.filter(o => getEstado(o) === 'Pronto').sort((a,b) => new Date(b.fields.Hora||0) - new Date(a.fields.Hora||0));

  document.getElementById('b-nov').textContent = novos.length;
  document.getElementById('b-fei').textContent = feitos.length;
  document.getElementById('s-nov').textContent = novos.length;
  document.getElementById('s-fei').textContent = feitos.length;

  const lista = tab === 'novos' ? novos : feitos;
  const c = document.getElementById('content');

  if (!lista.length) {
    c.innerHTML = '<div class="empty">' + (tab === 'novos' ? '🍃 Sem pedidos novos' : '✅ Sem pedidos feitos ainda') + '</div>';
    return;
  }

  c.innerHTML = lista.map(o => {
    const f = o.fields;
    const estado = getEstado(o);
    const items = parseItems(f.Itens);
    const action = tab === 'novos'
      ? `<div class="card-action"><button class="btn-pronto" onclick="marcar('${o.id}')">✅ Marcar como pronto</button></div>`
      : '';
    return `<div class="card ${estado === 'Novo' ? 'novo' : 'pronto'}">
      <div class="card-head ${estado === 'Novo' ? 'novo' : 'pronto'}">
        <span class="card-num">${f.NumeroPedido || '—'}</span>
        <span class="card-hora">⏰ ${hora(f.Hora)}</span>
      </div>
      <div class="card-body">
        ${items.map((item,i) => `<div class="item-line ${i===0?'main':''}">${item}</div>`).join('')}
      </div>
      ${f.Notas ? `<div class="card-nota">📝 ${f.Notas}</div>` : ''}
      ${action}
    </div>`;
  }).join('');
}

async function marcar(id) {
  try {
    const resp = await fetch(`https://api.airtable.com/v0/${BASE}/${TABLE}/${id}`, {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { 'Estado': 'Pronto' } })
    });
    if (resp.ok) {
      const o = orders.find(x => x.id === id);
      if (o) o.fields.Estado = 'Pronto';
      render();
    }
  } catch(e) { console.error(e); }
}

function playAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [1047,1319,1047,1319,1047].forEach((freq,i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'square'; o.frequency.value = freq;
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.4,t+0.02);
      g.gain.setValueAtTime(0.4,t+0.12); g.gain.linearRampToValueAtTime(0,t+0.16);
      o.start(t); o.stop(t+0.2);
    });
  } catch(e) {}
}

function abrirNovoDia() { document.getElementById('modal-nd').classList.add('show'); }
function fecharModal() { document.getElementById('modal-nd').classList.remove('show'); }
function confirmarNovoDia() {
  inicioDia = new Date().toISOString();
  localStorage.setItem('okashi_inicio', inicioDia);
  fecharModal();
  setTab('novos');
}

async function fetchOrders() {
  try {
    const url = `https://api.airtable.com/v0/${BASE}/${TABLE}?sort[0][field]=Hora&sort[0][direction]=asc&maxRecords=200`;
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!resp.ok) {
      document.getElementById('live-txt').textContent = 'Erro ligação';
      document.getElementById('content').innerHTML = '<div class="empty">Erro: ' + resp.status + '</div>';
      return;
    }
    const data = await resp.json();
    const records = data.records || [];

    if (!firstLoad) {
      const novos = records.filter(r => {
        if (knownIds.has(r.id)) return false;
        const e = r.fields.Estado;
        const nome = typeof e === 'string' ? e : (e?.name || '');
        return nome === 'Novo';
      });
      if (novos.length) {
        playAlarm();
        const al = document.getElementById('alerta');
        al.classList.add('show');
        setTimeout(() => al.classList.remove('show'), 3000);
        if (tab !== 'novos') setTab('novos');
      }
    }

    records.forEach(r => knownIds.add(r.id));
    orders = records;
    firstLoad = false;
    document.getElementById('live-txt').textContent = new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    render();
  } catch(e) {
    document.getElementById('live-txt').textContent = 'Sem ligação';
    document.getElementById('content').innerHTML = '<div class="empty">Sem ligação ao Airtable</div>';
  }
}

fetchOrders();
setInterval(fetchOrders, 7000);
</script>
</body>
</html>
