<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Okashi — Cozinha</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f5fff8; color: #1a1a2e; min-height: 100vh; }

header {
  background: #007a35;
  padding: 12px 16px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,122,53,0.4);
}
header h1 { font-size: 18px; font-weight: 800; color: #fff; }
.live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: rgba(255,255,255,0.9); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #7fff7f; animation: pulse 1.5s infinite; box-shadow: 0 0 6px #7fff7f; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

.filters {
  display: flex; gap: 8px; padding: 10px 14px;
  background: #fff; border-bottom: 2px solid #e0f5e8; overflow-x: auto;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.f-btn {
  padding: 7px 16px; border-radius: 20px; border: 2px solid #b0e0c0;
  background: none; color: #007a35; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: all 0.15s;
}
.f-btn.active { background: #007a35; border-color: #007a35; color: #fff; }

.stats {
  display: flex; gap: 10px; padding: 8px 14px;
  background: #fff; border-bottom: 1px solid #e0f5e8;
}
.stat { font-size: 13px; color: #aaa; font-weight: 600; }
.stat span { color: #007a35; font-weight: 800; }
.stat-novo span { color: #e03030; }
.stat-prep span { color: #cc8800; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px; padding: 14px;
}

.card {
  border-radius: 14px; overflow: hidden;
  border: 3px solid; background: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  transition: transform 0.15s;
}
.card.novo { border-color: #e03030; animation: pop .4s ease; }
.card.prep { border-color: #cc8800; }
.card.pronto { border-color: #007a35; opacity: 0.6; }
@keyframes pop { 0%{transform:scale(.93);opacity:0} 60%{transform:scale(1.02)} 100%{transform:scale(1);opacity:1} }

.card-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
.card-head.novo { background: #ffe8e8; }
.card-head.prep { background: #fff8e0; }
.card-head.pronto { background: #e8fff0; }

.card-num { font-size: 20px; font-weight: 900; color: #1a1a2e; }
.badge { font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
.badge-novo { background: #e03030; color: #fff; }
.badge-prep { background: #cc8800; color: #fff; }
.badge-pronto { background: #007a35; color: #fff; }

.card-hora { font-size: 12px; color: #aaa; padding: 5px 14px 0; font-weight: 600; }

.card-body { padding: 10px 14px; border-top: 1px solid #f0f0f0; }
.item-line { font-size: 14px; color: #333; padding: 3px 0; line-height: 1.4; font-weight: 500; }
.item-line.main { font-size: 15px; font-weight: 800; color: #1a1a2e; }
.item-line.removed { color: #e03030; font-size: 13px; font-style: italic; }

.card-notas {
  margin: 6px 14px 8px;
  background: #fff8e0; border-left: 4px solid #cc8800;
  border-radius: 0 8px 8px 0; padding: 7px 10px;
  font-size: 13px; color: #7a5000; font-weight: 600;
}

.card-total {
  padding: 8px 14px; border-top: 1px solid #f0f0f0;
  display: flex; justify-content: space-between; align-items: center;
}
.total-lbl { font-size: 12px; color: #aaa; font-weight: 600; }
.total-amt { font-size: 18px; font-weight: 900; color: #007a35; }

.card-actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #f0f0f0; }
.act-btn {
  flex: 1; padding: 10px 4px; border-radius: 10px; border: none;
  font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.12s;
}
.act-btn:active { transform: scale(0.96); }
.btn-prep { background: #cc8800; color: #fff; }
.btn-pronto { background: #007a35; color: #fff; }
.btn-back { background: #f0f0f0; color: #888; font-size: 11px; }

.empty {
  grid-column: 1/-1; text-align: center;
  padding: 60px 20px; color: #c0e0c0; font-size: 16px; font-weight: 600;
}

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #007a35; color: #fff; padding: 12px 24px;
  border-radius: 20px; font-size: 14px; font-weight: 700;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  box-shadow: 0 4px 16px rgba(0,122,53,0.4);
}
.toast.show { opacity: 1; }

.novo-alert {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: #e03030; color: #fff; padding: 14px 28px;
  border-radius: 20px; font-size: 16px; font-weight: 800;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  box-shadow: 0 4px 20px rgba(224,48,48,0.5);
  letter-spacing: 0.5px;
}
.novo-alert.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🍃 Okashi — Cozinha</h1>
  <div class="live"><div class="dot"></div><span id="live-txt">A ligar...</span></div>
</header>

<div class="filters">
  <button class="f-btn active" id="f-todos" onclick="setFilter('todos')">Todos</button>
  <button class="f-btn" id="f-novo" onclick="setFilter('novo')">🔴 Novos</button>
  <button class="f-btn" id="f-prep" onclick="setFilter('prep')">🟡 Em prep.</button>
  <button class="f-btn" id="f-pronto" onclick="setFilter('pronto')">✅ Prontos</button>
</div>

<div class="stats">
  <div class="stat stat-novo">Novos: <span id="s-novo">0</span></div>
  <div class="stat stat-prep">Em prep.: <span id="s-prep">0</span></div>
  <div class="stat">Prontos: <span id="s-pronto">0</span></div>
</div>

<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>
<div class="novo-alert" id="novo-alert">🔔 NOVO PEDIDO!</div>

<script>
const TOKEN = 'patxsjHccHr0MqzD4.3c2af2923a6de35efe015937845b6ab4b9d59d81c561c18cb9cc7eb472cdc0bd';
const BASE  = 'app1DlNHDekbP5asp';
const TABLE = 'tblQU3C1h4D8mxuqA';

let allOrders = [];
let filter = 'todos';
let knownIds = new Set();
let firstLoad = true;

function setFilter(f) {
  filter = f;
  ['todos','novo','prep','pronto'].forEach(x => document.getElementById('f-'+x).classList.remove('active'));
  document.getElementById('f-'+f).classList.add('active');
  render();
}

function hora(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
}

function parseItems(txt) {
  if (!txt) return [];
  return txt.split('\n').filter(l => l.trim());
}

function render() {
  const grid = document.getElementById('grid');
  const ordem = { Novo:0, 'Em preparacao':1, Pronto:2 };
  let lista = [...allOrders].sort((a,b) => {
    const ae = ordem[a.fields.Estado] ?? 3;
    const be = ordem[b.fields.Estado] ?? 3;
    if (ae !== be) return ae - be;
    return new Date(a.fields.Hora||0) - new Date(b.fields.Hora||0);
  });

  const fMap = { novo:'Novo', prep:'Em preparacao', pronto:'Pronto' };
  if (filter !== 'todos') lista = lista.filter(o => o.fields.Estado === fMap[filter]);

  document.getElementById('s-novo').textContent = allOrders.filter(o => o.fields.Estado === 'Novo').length;
  document.getElementById('s-prep').textContent = allOrders.filter(o => o.fields.Estado === 'Em preparacao').length;
  document.getElementById('s-pronto').textContent = allOrders.filter(o => o.fields.Estado === 'Pronto').length;

  if (!lista.length) {
    grid.innerHTML = '<div class="empty">🍃 ' + (filter !== 'todos' ? 'Sem pedidos nesta categoria' : 'Sem pedidos de momento') + '</div>';
    return;
  }

  const clsMap = { Novo:'novo', 'Em preparacao':'prep', Pronto:'pronto' };
  const badgeMap = { Novo:'badge-novo', 'Em preparacao':'badge-prep', Pronto:'badge-pronto' };
  const labelMap = { Novo:'Novo', 'Em preparacao':'Em prep.', Pronto:'Pronto' };

  grid.innerHTML = lista.map(o => {
    const f = o.fields;
    const estado = f.Estado || 'Novo';
    const cls = clsMap[estado] || 'novo';
    const items = parseItems(f.Itens);
    const total = f.Total ? '€' + Number(f.Total).toFixed(2) : '';

    const actions = estado === 'Novo'
      ? `<button class="act-btn btn-prep" onclick="mudar('${o.id}','Em preparacao')">Em preparação</button>
         <button class="act-btn btn-back" onclick="mudar('${o.id}','Pronto')" style="max-width:70px">✓ Pronto</button>`
      : estado === 'Em preparacao'
      ? `<button class="act-btn btn-pronto" onclick="mudar('${o.id}','Pronto')">✅ Marcar como pronto</button>`
      : `<button class="act-btn btn-back" onclick="mudar('${o.id}','Em preparacao')">↩ Voltar</button>`;

    return `<div class="card ${cls}">
      <div class="card-head ${cls}">
        <span class="card-num">${f.NumeroPedido || '—'}</span>
        <span class="badge ${badgeMap[estado]}">${labelMap[estado]}</span>
      </div>
      ${f.Hora ? `<div class="card-hora">⏰ ${hora(f.Hora)}</div>` : ''}
      <div class="card-body">
        ${items.map((item,i) => `<div class="item-line ${i===0?'main':''} ${item.startsWith('sem ')||item.startsWith('Sem ')||item.startsWith('SEM ')?'removed':''}">${item}</div>`).join('')}
      </div>
      ${f.Notas ? `<div class="card-notas">📝 ${f.Notas}</div>` : ''}
      ${total ? `<div class="card-total"><span class="total-lbl">Total</span><span class="total-amt">${total}</span></div>` : ''}
      <div class="card-actions">${actions}</div>
    </div>`;
  }).join('');
}

async function mudar(id, novoEstado) {
  try {
    const resp = await fetch(`https://api.airtable.com/v0/${BASE}/${TABLE}/${id}`, {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { 'Estado': novoEstado } })
    });
    if (resp.ok) {
      const o = allOrders.find(x => x.id === id);
      if (o) o.fields.Estado = novoEstado;
      render();
    }
  } catch(e) { console.error(e); }
}

function playAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = [1047, 1319, 1047, 1319, 1047];
    freqs.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'square';
      o.frequency.value = freq;
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.4, t + 0.02);
      g.gain.setValueAtTime(0.4, t + 0.12);
      g.gain.linearRampToValueAtTime(0, t + 0.16);
      o.start(t); o.stop(t + 0.2);
    });
  } catch(e) {}
}

function showNovoAlert() {
  const el = document.getElementById('novo-alert');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function fetchOrders() {
  try {
    const url = `https://api.airtable.com/v0/${BASE}/${TABLE}?sort[0][field]=Hora&sort[0][direction]=desc&maxRecords=50`;
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!resp.ok) { document.getElementById('live-txt').textContent = 'Erro de ligação'; return; }
    const data = await resp.json();
    const records = data.records || [];

    if (!firstLoad) {
      const novos = records.filter(r => !knownIds.has(r.id) && r.fields.Estado === 'Novo');
      if (novos.length) {
        playAlarm();
        showNovoAlert();
        showToast('🔔 ' + novos.length + ' novo(s) pedido(s)!');
      }
    }

    records.forEach(r => knownIds.add(r.id));
    allOrders = records;
    firstLoad = false;

    document.getElementById('live-txt').textContent = new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    render();
  } catch(e) {
    document.getElementById('live-txt').textContent = 'Sem ligação';
  }
}

fetchOrders();
setInterval(fetchOrders, 7000);
</script>
</body>
</html>
