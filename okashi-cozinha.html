<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Okashi — Cozinha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0d1a0a; color: #fff; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #0a6e1a, #0a4e10);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #4eff70; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .live-label { font-size: 13px; color: #80ff90; display: flex; align-items: center; }

  .controls {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: #111a0e;
    border-bottom: 1px solid #1e3a18;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid #2a5020;
    background: none; color: #80c080; font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active { background: #1a4a10; border-color: #4aaa40; color: #c0ffb0; }
  .refresh-info { margin-left: auto; font-size: 12px; color: #507040; }

  .orders-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    padding: 16px;
  }

  .order-card {
    background: #111a0e;
    border: 2px solid #2a5020;
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .order-card.novo { border-color: #e03030; animation: newOrder 0.5s ease; }
  .order-card.em-preparacao { border-color: #d0a000; }
  .order-card.pronto { border-color: #208040; opacity: 0.7; }

  @keyframes newOrder {
    0% { transform: scale(0.95); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .card-header {
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-header.novo { background: #3a0808; }
  .card-header.em-preparacao { background: #2a2000; }
  .card-header.pronto { background: #0a2a14; }

  .pedido-num { font-size: 18px; font-weight: 800; color: #fff; }
  .estado-badge {
    font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge-novo { background: #e03030; color: #fff; }
  .badge-em-preparacao { background: #d0a000; color: #000; }
  .badge-pronto { background: #208040; color: #fff; }

  .card-time { font-size: 11px; color: #507040; padding: 4px 14px 0; }

  .card-items { padding: 10px 14px; border-top: 1px solid #1e3a18; }
  .item-line { font-size: 14px; color: #c0e0b0; padding: 3px 0; line-height: 1.4; }
  .item-line.topping { color: #708060; font-size: 13px; padding-left: 10px; }

  .card-notes {
    margin: 6px 14px 10px;
    background: #1a2e14; border-left: 3px solid #4a8040;
    border-radius: 0 8px 8px 0; padding: 6px 10px;
    font-size: 13px; color: #a0d090; font-style: italic;
  }

  .card-total {
    padding: 8px 14px;
    border-top: 1px solid #1e3a18;
    display: flex; justify-content: space-between; align-items: center;
  }
  .total-label { font-size: 12px; color: #507040; }
  .total-amount { font-size: 17px; font-weight: 800; color: #80ff90; }

  .card-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #1e3a18; }
  .action-btn {
    flex: 1; padding: 10px; border-radius: 10px; border: none;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: opacity 0.15s;
  }
  .action-btn:active { opacity: 0.75; }
  .btn-preparar { background: #d0a000; color: #000; }
  .btn-pronto { background: #208040; color: #fff; }
  .btn-arquivar { background: #1e3a18; color: #507040; font-size: 12px; }

  .empty-state {
    grid-column: 1/-1; text-align: center;
    padding: 60px 20px; color: #2a5020;
    font-size: 16px;
  }
  .empty-state div { font-size: 48px; margin-bottom: 12px; }

  .sound-btn {
    background: none; border: 1px solid #2a5020; border-radius: 20px;
    color: #507040; font-size: 13px; padding: 5px 12px; cursor: pointer;
  }
  .sound-btn.on { color: #80c080; border-color: #4a8040; }
</style>
</head>
<body>

<header>
  <h1>🍃 OKASHI — Cozinha</h1>
  <div class="live-label">
    <span class="status-dot"></span>
    <span id="live-text">A atualizar...</span>
  </div>
</header>

<div class="controls">
  <button class="filter-btn active" id="f-todos" onclick="setFilter('todos')">Todos</button>
  <button class="filter-btn" id="f-novo" onclick="setFilter('Novo')">🔴 Novos</button>
  <button class="filter-btn" id="f-prep" onclick="setFilter('Em preparação')">🟡 Em prep.</button>
  <button class="filter-btn" id="f-pronto" onclick="setFilter('Pronto')">✅ Prontos</button>
  <button class="sound-btn" id="sound-btn" onclick="toggleSound()">🔔 Som: ON</button>
  <span class="refresh-info" id="refresh-info">—</span>
</div>

<div class="orders-grid" id="orders-grid">
  <div class="empty-state"><div>🍇</div>A aguardar pedidos...</div>
</div>

<script>
const AIRTABLE_TOKEN = 'patmO0sek368PNMKT.6fafae521b0705c64a45a1f4fcfed111baecc9e4910feceeffa2d4914e99e3f3'; // substitui pelo teu token
const BASE_ID = 'apphwoJIolURQfghd';
const TABLE_ID = 'tblWHxm3Lw2FwcNJC';

let allOrders = [];
let currentFilter = 'todos';
let soundOn = true;
let knownIds = new Set();
let firstLoad = true;

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? '🔔 Som: ON' : '🔕 Som: OFF';
  document.getElementById('sound-btn').classList.toggle('on', soundOn);
}

function playAlert() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

function setFilter(f) {
  currentFilter = f;
  ['todos','f-novo','f-prep','f-pronto'].forEach(id => {
    document.getElementById(id)?.classList.remove('active');
  });
  const map = {'todos':'f-todos','Novo':'f-novo','Em preparação':'f-prep','Pronto':'f-pronto'};
  document.getElementById(map[f] || 'f-todos')?.classList.add('active');
  renderOrders();
}

function getEstadoClass(estado) {
  if (estado === 'Novo') return 'novo';
  if (estado === 'Em preparação') return 'em-preparacao';
  if (estado === 'Pronto') return 'pronto';
  return 'novo';
}

function getBadgeClass(estado) {
  if (estado === 'Novo') return 'badge-novo';
  if (estado === 'Em preparação') return 'badge-em-preparacao';
  if (estado === 'Pronto') return 'badge-pronto';
  return 'badge-novo';
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('pt-PT', {hour:'2-digit',minute:'2-digit'});
}

function parseItems(text) {
  if (!text) return [];
  return text.split('\n').filter(l => l.trim());
}

function renderOrders() {
  const grid = document.getElementById('orders-grid');
  let filtered = allOrders;
  if (currentFilter !== 'todos') {
    filtered = allOrders.filter(o => o.fields['Estado'] === currentFilter);
  }

  // Sort: Novo first, then Em preparação, then Pronto
  const order = {'Novo':0,'Em preparação':1,'Pronto':2};
  filtered.sort((a,b) => {
    const ao = order[a.fields['Estado']] ?? 3;
    const bo = order[b.fields['Estado']] ?? 3;
    if (ao !== bo) return ao - bo;
    return new Date(a.fields['DataHora']||0) - new Date(b.fields['DataHora']||0);
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div>🍇</div>' +
      (currentFilter === 'todos' ? 'A aguardar pedidos...' : 'Sem pedidos nesta categoria') + '</div>';
    return;
  }

  grid.innerHTML = filtered.map(o => {
    const f = o.fields;
    const estado = f['Estado'] || 'Novo';
    const cls = getEstadoClass(estado);
    const badgeCls = getBadgeClass(estado);
    const items = parseItems(f['Itens']);
    const hora = formatTime(f['DataHora']);
    const total = f['Total'] ? '€' + Number(f['Total']).toFixed(2) : '';

    const actions = estado === 'Novo' ?
      `<button class="action-btn btn-preparar" onclick="updateEstado('${o.id}','Em preparação')">Em preparação</button>
       <button class="action-btn btn-arquivar" onclick="updateEstado('${o.id}','Pronto')">Pronto</button>` :
      estado === 'Em preparação' ?
      `<button class="action-btn btn-pronto" onclick="updateEstado('${o.id}','Pronto')">✅ Marcar como pronto</button>` :
      `<button class="action-btn btn-arquivar" onclick="updateEstado('${o.id}','Em preparação')">↩ Voltar a prep.</button>`;

    return `
    <div class="order-card ${cls}" id="card-${o.id}">
      <div class="card-header ${cls}">
        <span class="pedido-num">${f['Pedido'] || 'Pedido'}</span>
        <span class="estado-badge ${badgeCls}">${estado}</span>
      </div>
      ${hora ? `<div class="card-time">⏰ ${hora}</div>` : ''}
      <div class="card-items">
        ${items.map(item => `<div class="item-line">${item}</div>`).join('')}
      </div>
      ${f['Notas'] ? `<div class="card-notes">📝 ${f['Notas']}</div>` : ''}
      ${total ? `<div class="card-total"><span class="total-label">Total</span><span class="total-amount">${total}</span></div>` : ''}
      <div class="card-actions">${actions}</div>
    </div>`;
  }).join('');
}

async function updateEstado(recordId, novoEstado) {
  try {
    const resp = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}/${recordId}`, {
      method: 'PATCH',
      headers: {
        'Authorization': 'Bearer ' + AIRTABLE_TOKEN,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ fields: { 'Estado': novoEstado } })
    });
    if (resp.ok) {
      // Update locally for instant feedback
      const o = allOrders.find(x => x.id === recordId);
      if (o) o.fields['Estado'] = novoEstado;
      renderOrders();
    }
  } catch(e) {
    alert('Erro: ' + e.message);
  }
}

async function fetchOrders() {
  try {
    const url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}?sort[0][field]=Data%2FHora&sort[0][direction]=desc&maxRecords=50`;
    const resp = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + AIRTABLE_TOKEN }
    });
    if (!resp.ok) {
      document.getElementById('live-text').textContent = 'Erro de ligação';
      return;
    }
    const data = await resp.json();
    const records = data.records || [];

    // Check for new orders
    if (!firstLoad) {
      let hasNew = false;
      records.forEach(r => {
        if (!knownIds.has(r.id) && r.fields['Estado'] === 'Novo') {
          hasNew = true;
        }
      });
      if (hasNew) playAlert();
    }

    records.forEach(r => knownIds.add(r.id));
    allOrders = records;
    firstLoad = false;

    const now = new Date();
    document.getElementById('live-text').textContent = 'Atualizado às ' + now.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('refresh-info').textContent = records.filter(r => r.fields['Estado'] === 'Novo').length + ' novo(s) · ' + records.filter(r => r.fields['Estado'] === 'Em preparação').length + ' em prep.';

    renderOrders();
  } catch(e) {
    document.getElementById('live-text').textContent = 'Erro: ' + e.message;
  }
}

document.getElementById('sound-btn').classList.add('on');
fetchOrders();
setInterval(fetchOrders, 8000); // atualiza a cada 8 segundos
</script>
</body>
</html>
