<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Okashi Açaí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a1942; --ink-soft:#7a2f66; --accent:#c93c7c; --accent-dark:#8a1f5c;
    --success:#2f8f5b; --warn-bg:#fbe7d6;
    --surface:#fffaf2; --border:#e7c9dd; --border-strong:#c93c7c;
    --bg-grad: linear-gradient(150deg,#ff6fa0 0%,#ff9a56 55%,#ffc93c 100%);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Nunito',sans-serif; color:var(--ink); background:var(--bg-grad); min-height:100vh; }
  h1,h2,h3,.display{ font-family:'Baloo 2',cursive; }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:96px; position:relative; }
  header{ padding:18px 18px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{ width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 0 rgba(74,25,66,.25)); }
  .brand-text .name{ font-weight:800; font-size:1.28rem; line-height:1.05; }
  .brand-text .tag{ font-size:.72rem; color:rgba(74,25,66,.75); font-weight:700; }
  .header-right{ display:flex; align-items:center; gap:8px; }
  .lang-toggle{ display:flex; background:rgba(255,255,255,.55); border-radius:999px; padding:3px; border:1.5px solid rgba(74,25,66,.25); }
  .lang-toggle button{ border:none;background:transparent; font-family:'Nunito';font-weight:800;font-size:.72rem; padding:5px 9px;border-radius:999px;color:var(--ink-soft);cursor:pointer; }
  .lang-toggle button.active{ background:var(--ink);color:#fff8ee; }
  .vendor-pill{ font-size:.68rem;font-weight:800; padding:5px 10px;border-radius:999px; display:flex;align-items:center;gap:5px; background:rgba(255,255,255,.55); border:1.5px solid rgba(74,25,66,.25); color:var(--ink-soft); }
  .dot{width:7px;height:7px;border-radius:50%;background:#b0479a;}
  .dot.on{background:var(--success);box-shadow:0 0 0 3px rgba(47,143,91,.25);}
  .tabs{ display:flex; gap:6px; padding:0 18px 12px; }
  .tab-btn{ flex:1; border:2px solid transparent; padding:11px 8px; border-radius:14px; font-family:'Baloo 2'; font-weight:700; font-size:.92rem; cursor:pointer; background:rgba(255,255,255,.4); color:var(--ink); }
  .tab-btn.active{ background:var(--ink); color:#fff8ee; }
  main{ padding:2px 18px 20px; }
  .config-banner{ margin:0 18px 14px;background:#fff3cd;border:2px solid #e0a800;color:#5c4400;padding:12px 14px;border-radius:14px;font-size:.78rem;font-weight:700;line-height:1.5; }
  section.group{ margin-bottom:26px; }
  .group-head{ display:flex;align-items:baseline;justify-content:space-between; margin-bottom:10px; }
  .group-head h2{ margin:0;font-size:1.4rem; }
  .group-note{ font-size:.72rem;font-weight:700;color:rgba(74,25,66,.7); }
  .card{ background:var(--surface); border:2px solid var(--border-strong); border-radius:20px; padding:14px 16px; margin-bottom:12px; }
  .card h3{ margin:0 0 8px; font-size:1.05rem; }
  .size-row{ display:flex;gap:8px;margin-bottom:10px; }
  .size-opt{ flex:1;text-align:center;padding:7px 4px;border-radius:12px;border:2px solid var(--border);font-weight:800;font-size:.78rem;cursor:pointer;background:#fff;color:var(--ink-soft); }
  .size-opt small{display:block;font-weight:700;font-size:.7rem;opacity:.8;}
  .size-opt.selected{ background:var(--accent); border-color:var(--accent-dark); color:#fff; }
  .add-btn{ width:100%;padding:10px;border:none;border-radius:12px;background:var(--ink);color:#fff8ee;font-family:'Baloo 2';font-weight:700;font-size:.9rem;cursor:pointer; }
  .add-btn:active{ transform:scale(.98); }
  .chip-block{ margin-bottom:12px; }
  .chip-label{ font-size:.72rem;font-weight:800;color:var(--ink-soft); text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px; }
  .chips{ display:flex;flex-wrap:wrap;gap:7px; }
  .chip{ padding:7px 12px;border-radius:999px;border:2px solid var(--border);background:#fff;font-size:.78rem;font-weight:700;color:var(--ink-soft);cursor:pointer;user-select:none; }
  .chip.selected{ background:var(--ink); border-color:var(--ink); color:#fff8ee; }
  .chip.extra.selected{ background:var(--accent); border-color:var(--accent-dark);}
  .chip.strike{ text-decoration:line-through; opacity:.55; }
  .chip .plus{ opacity:.7;font-weight:800;margin-left:3px;}
  .hint{ font-size:.68rem;color:var(--ink-soft);opacity:.85;margin:-4px 0 8px; }
  .cart-fab{ position:fixed;left:50%;transform:translateX(-50%);bottom:18px;max-width:444px;width:calc(100% - 36px);background:var(--ink);color:#fff8ee;border-radius:18px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 22px rgba(74,25,66,.35);cursor:pointer;border:none;font-family:'Nunito';z-index:40; }
  .cart-fab .l{ display:flex;align-items:center;gap:10px;font-weight:800; }
  .cart-fab .badge{ background:var(--accent);color:#fff;border-radius:999px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800; }
  .cart-fab .price{ font-family:'Baloo 2';font-weight:700;font-size:1.1rem; }
  .overlay{ position:fixed;inset:0;background:rgba(74,25,66,.45);display:none;align-items:flex-end;justify-content:center;z-index:60; }
  .overlay.open{ display:flex; }
  .sheet{ background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;padding:20px 18px 26px;position:relative; }
  .sheet-handle{ width:40px;height:5px;border-radius:999px;background:rgba(74,25,66,.25);margin:0 auto 14px; }
  .sheet h2{ margin:0 0 14px;font-size:1.3rem; }
  .cart-line{ display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);gap:10px; }
  .cart-line .info b{ font-size:.92rem; }
  .cart-line .info .opts{ font-size:.72rem;color:var(--ink-soft);margin-top:2px;line-height:1.4; }
  .cart-line .right{ text-align:right;flex-shrink:0; }
  .cart-line .right .price{ font-weight:800;font-size:.9rem; }
  .remove-btn{ border:none;background:none;color:var(--accent-dark);font-size:.7rem;font-weight:800;cursor:pointer;margin-top:4px; }
  .empty-note{ text-align:center;padding:30px 10px;color:var(--ink-soft);font-weight:700;font-size:.9rem; }
  .field{ margin-bottom:14px; }
  .field label{ display:block;font-size:.75rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px; }
  .field input, .field textarea, .field select{ width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--border);font-family:'Nunito';font-size:.9rem;background:#fff;color:var(--ink); }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid var(--accent); border-color:var(--accent); }
  .fulfil-opt{ border:2px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer; }
  .fulfil-opt.selected{ border-color:var(--accent-dark);background:#fff0f7; }
  .fulfil-opt.disabled{ opacity:.5;cursor:not-allowed; }
  .fulfil-opt .t{ font-weight:800;font-size:.92rem;display:flex;justify-content:space-between; }
  .fulfil-opt .d{ font-size:.76rem;color:var(--ink-soft);margin-top:2px; }
  .total-row{ display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-family:'Baloo 2'; }
  .total-row .lab{ font-size:.95rem;color:var(--ink-soft);font-weight:700; }
  .total-row .val{ font-size:1.5rem;font-weight:700; }
  .primary-btn{ width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-family:'Baloo 2';font-weight:700;font-size:1rem;cursor:pointer;margin-top:6px;text-align:center;text-decoration:none;display:block; }
  .primary-btn:disabled{ background:#d9b8ca;cursor:not-allowed; }
  .ghost-btn{ width:100%;padding:11px;border:2px solid var(--border-strong);border-radius:14px;background:transparent;color:var(--ink);font-family:'Baloo 2';font-weight:700;font-size:.9rem;cursor:pointer;margin-top:8px; }
  .close-x{ position:absolute;top:16px;right:16px;border:none;background:rgba(74,25,66,.08);width:32px;height:32px;border-radius:50%;font-size:1rem;color:var(--ink);cursor:pointer; }
  .order-card{ background:var(--surface);border:2px solid var(--border-strong);border-radius:20px;padding:16px;margin-bottom:14px; }
  .order-card .top{ display:flex;justify-content:space-between;align-items:center;margin-bottom:10px; }
  .order-card .code{ font-family:'Baloo 2';font-weight:700;font-size:1.1rem; }
  .order-card .when{ font-size:.7rem;color:var(--ink-soft);font-weight:700; }
  .paypill{ display:inline-block;font-size:.65rem;font-weight:800;padding:3px 9px;border-radius:999px;margin-bottom:8px; }
  .paypill.pending{ background:var(--warn-bg);color:#8a5a1f; }
  .paypill.confirmed{ background:#e4f5ec;color:var(--success); }
  .stepper{ display:flex;align-items:center;margin:14px 0 8px; }
  .step{ flex:1;text-align:center;position:relative; }
  .step .circ{ width:26px;height:26px;border-radius:50%;background:#fff;border:2.5px solid var(--border);margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:var(--ink-soft); }
  .step.done .circ{ background:var(--success);border-color:var(--success);color:#fff; }
  .step.current .circ{ background:var(--accent);border-color:var(--accent-dark);color:#fff; }
  .step .lab{ font-size:.62rem;font-weight:800;color:var(--ink-soft);line-height:1.2; }
  .step.done .lab, .step.current .lab{ color:var(--ink); }
  .step-line{ position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--border);z-index:-1; }
  .step:first-child .step-line{ display:none; }
  .step.done .step-line{ background:var(--success); }
  .order-detail{ font-size:.78rem;color:var(--ink-soft);margin-top:8px;line-height:1.5; }
  .order-detail b{ color:var(--ink); }
  .toast{ position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff8ee;padding:10px 18px;border-radius:999px;font-weight:800;font-size:.82rem;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s; }
  .toast.show{ opacity:1; }
  .lookup-row{ display:flex;gap:8px;margin-bottom:16px; }
  .lookup-row input{ flex:1;padding:10px 12px;border-radius:12px;border:2px solid var(--border);font-family:'Nunito';font-size:.9rem; }
  .lookup-row button{ padding:10px 16px;border:none;border-radius:12px;background:var(--ink);color:#fff8ee;font-family:'Baloo 2';font-weight:700;cursor:pointer; }
  .checkbox-row{ display:flex;align-items:center;gap:8px;margin-bottom:14px; }
  .checkbox-row input{ width:18px;height:18px;flex-shrink:0;accent-color:var(--accent); }
  .checkbox-row label{ font-size:.85rem;font-weight:700;color:var(--ink); cursor:pointer; }
  .confirm-code{ text-align:center;padding:10px 0 4px; }
  .confirm-code .big-code{ font-family:'Baloo 2';font-weight:800;font-size:2.2rem;color:var(--accent-dark);letter-spacing:1px;margin:8px 0; }
  .confirm-code .hint{ font-size:.78rem;color:var(--ink-soft);margin:0 0 18px; }
  svg.icon{ display:block; }
</style>
</head>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

  leitepo:{pt:'Leite em Pó',en:'Powdered Milk'}, granola:{pt:'Granola',en:'Granola'},
  condensado:{pt:'Leite Condensado',en:'Condensed Milk'}, coco:{pt:'Coco Laminado',en:'Laminated Coconut'},
  linhaca:{pt:'Linhaça',en:'Linseed'}, mel:{pt:'Mel',en:'Honey'}, aveia:{pt:'Aveia',en:'Oat'},
  manteiga:{pt:'Manteiga de Amendoim',en:'Peanut Butter'}
};
const FRUIT_IDS = ['morango','banana','kiwi'];
const LIQUID_IDS = ['mel','manteiga','condensado'];
const SOLID_IDS = ['granola','aveia','coco','linhaca'];
const EXTRA_TOPPING_IDS = [...FRUIT_IDS, ...LIQUID_IDS, ...SOLID_IDS];

const BOWL_SIZES = [{id:'S',price:9},{id:'M',price:10},{id:'L',price:12}];
const ACAI_SIZES = [{id:'S',price:10},{id:'M',price:11},{id:'L',price:14}];
const EXTRAS = [{id:'pacoca',pt:'Paçoca',en:'Peanuts',cost:1},{id:'nutella',pt:'Nutella',en:'Nutella',cost:2},{id:'whey',pt:'Whey',en:'Whey Protein',cost:2}];
const BEACH_ZONES = ['Nadador Salvador Kailua','Nadador Salvador Swara','Nadador Salvador','Rampoa'];

const BOWLS = [
  {id:'classic', pt:'Bowl Clássica', en:'Classic Bowl', ingredients:['banana','morango','leitepo','granola','condensado']},
  {id:'superfood', pt:'Bowl Superfood', en:'Bowl Superfood', ingredients:['morango','coco','linhaca','granola','mel']},
  {id:'fitness', pt:'Bowl Fitness', en:'Bowl Fitness', ingredients:['banana','aveia','leitepo','granola','manteiga']},
  {id:'tropical', pt:'Bowl Tropical', en:'Bowl Tropical', ingredients:['kiwi','banana','morango','coco','granola']},
];

const STATUS_STEPS = ['received','preparing','ready','completed'];
// A tabela Pedidos só tem os estados Novo / Em preparacao / Pronto (usados pela cozinha).
// "Entregue" não existe como valor de Estado — é marcado como texto dentro de Notas pela app do vendedor.
const STATUS_FROM_AIRTABLE = {Novo:'received', 'Em preparacao':'preparing', Pronto:'ready'};
function estadoTexto(f){ const e = f['Estado']; if(!e) return ''; return typeof e==='string' ? e : (e.name||''); }
function isPaid(notas){ return /Pagamento:/i.test(notas||''); }
function isDelivered(notas){ return /\bEntregue\b/i.test(notas||''); }

let state = {
  lang:'pt', tab:'menu', vendorOnline:false,
  cart:[], bowlConfig:{}, builder:{acaiSize:'M', fruits:[], liquids:[], solids:[], extras:[]},
  cartOpen:false, checkoutStage:'cart',
  checkoutName:'', checkoutPhone:'', checkoutNotes:'', fulfil:'pickup', beachZone:'',
  wantsInvoice:false, taxId:'', confirmationOrder:null,
  myOrders:[], lookupCode:'', lookupResult:null, lookupError:'',
};

function t(k){ return STR[state.lang][k]; }
function fmt(n){ return '€' + n.toFixed(2).replace('.', ','); }
function ingLabel(id){ return INGREDIENT_CATALOG[id][state.lang]; }

/* ============ localStorage helpers (per-device only, not shared) ============ */
function lget(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lset(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

/* ============ Airtable helpers ============ */
async function airtableFetch(table, method, pathAndQuery, body){
  const url = 'https://api.airtable.com/v0/' + AIRTABLE_BASE_ID + '/' + encodeURIComponent(table) + (pathAndQuery||'');
  const res = await fetch(url, {
    method: method || 'GET',
    headers: { 'Authorization':'Bearer ' + AIRTABLE_TOKEN, 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){ const txt = await res.text(); throw new Error('Airtable '+res.status+': '+txt); }
  return res.json();
}

// Formato compatível com o parser da cozinha: 1ª linha do item (sem "+"), depois
// linhas "+ ..." para toppings/extras — a cozinha separa isto em blocos automaticamente.
function buildItemsAirtableText(cart){
  const lines = [];
  cart.forEach(c=>{
    const qtyPrefix = c.qty>1 ? c.qty+'x ' : '';
    lines.push(qtyPrefix + c.label + ' (' + c.size + ') (+€' + (c.price*c.qty).toFixed(2) + ')');
    if(c.removed && c.removed.length) lines.push('+ sem: '+c.removed.join(', '));
    if(c.toppings && c.toppings.length) lines.push('+ '+c.toppings.join(', '));
    if(c.extraTopping) lines.push('+ '+c.extraTopping);
    if(c.extras && c.extras.length) c.extras.forEach(e=> lines.push('+ '+e));
  });
  return lines.join('\n');
}

function decodeOrder(record){
  const f = record.fields || {};
  const notas = f['Notas'] || '';
  const paid = isPaid(notas);
  const estado = estadoTexto(f);
  const status = isDelivered(notas) ? 'completed' : (STATUS_FROM_AIRTABLE[estado] || 'received');
  return {
    recordId: record.id,
    id: f['NumeroPedido'] || '',
    createdAt: f['Hora'] ? Date.parse(f['Hora']) : Date.now(),
    status,
    paid,
    fulfillment: f['PedidoPraia'] ? 'beach' : 'pickup',
    beachZone: f['PedidoPraia'] ? (f['OndeEntregar'] || '') : '',
    notes: notas,
    itemsText: f['Itens'] || '',
    total: f['Total'] || 0,
  };
}

async function refreshVendorStatus(){
  if(!CONFIG_OK){ state.vendorOnline = false; return; }
  try{
    const data = await airtableFetch(STATUS_TABLE, 'GET', '?maxRecords=1');
    state.vendorOnline = data.records && data.records[0] ? !!data.records[0].fields['LojaOnlinePraia'] : false;
  }catch(e){ console.error('vendor status fetch failed', e); state.vendorOnline = false; }
  if(!state.vendorOnline && state.fulfil==='beach') state.fulfil='pickup';
}

async function fetchOrderByCode(code){
  const formula = encodeURIComponent("{NumeroPedido}='" + code.trim() + "'");
  const data = await airtableFetch(ORDERS_TABLE, 'GET', '?filterByFormula=' + formula + '&maxRecords=1');
  if(data.records && data.records.length>0) return decodeOrder(data.records[0]);
  return null;
}

async function refreshMyOrders(){
  if(!CONFIG_OK) return;
  for(const o of state.myOrders){
    try{ const fresh = await fetchOrderByCode(o.id); if(fresh) o.data = fresh; }catch(e){ console.error(e); }
  }
}

setInterval(async ()=>{
  await refreshVendorStatus();
  if(state.tab === 'track'){ await refreshMyOrders(); }
  render();
}, 6000);

function getBowlConfig(id){
  if(!state.bowlConfig[id]) state.bowlConfig[id] = { size:'M', excluded:[], extraTopping:null, premium:[] };
  return state.bowlConfig[id];
}

function loadInitial(){
  const langPref = lget('okashi-lang');
  if(langPref === 'pt' || langPref === 'en') state.lang = langPref;
  const cartDraft = lget('okashi-cart-draft');
  if(cartDraft){ try{ state.cart = JSON.parse(cartDraft); }catch(e){} }
  const myOrdersRaw = lget('okashi-my-orders');
  if(myOrdersRaw){ try{ state.myOrders = JSON.parse(myOrdersRaw).map(id=>({id, data:null})); }catch(e){} }
  render();
  refreshVendorStatus().then(render);
  refreshMyOrders().then(render);
}

function addBowlToCart(bowl){
  const cfg = getBowlConfig(bowl.id);
  const sizeInfo = BOWL_SIZES.find(s=>s.id===cfg.size);
  const extraCost = cfg.extraTopping ? 0.5 : 0;
  const premiumCost = cfg.premium.reduce((s,id)=>{ const e=EXTRAS.find(x=>x.id===id); return s+(e?e.cost:0); },0);
  const removedLabels = cfg.excluded.map(ingLabel);
  const extraToppingLabel = cfg.extraTopping ? ('+ ' + ingLabel(cfg.extraTopping) + ' (+' + fmt(0.5) + ')') : null;
  const premiumLabels = cfg.premium.map(id=>{ const e=EXTRAS.find(x=>x.id===id); return (state.lang==='pt'?e.pt:e.en)+' (+'+fmt(e.cost)+')'; });
  state.cart.push({
    key:'bowl-'+bowl.id+'-'+Date.now(), kind:'bowl',
    label: state.lang==='pt'?bowl.pt:bowl.en, size:cfg.size,
    price: sizeInfo.price + extraCost + premiumCost,
    removed: removedLabels, extraTopping: extraToppingLabel, extras: premiumLabels, qty:1
  });
  state.bowlConfig[bowl.id] = { size:'M', excluded:[], extraTopping:null, premium:[] };
  persistCart(); toast(t('added')); render();
}

function addAcaiToCart(){
  const b = state.builder;
  const sizeInfo = ACAI_SIZES.find(s=>s.id===b.acaiSize);
  const extrasCost = b.extras.reduce((sum,eid)=>{ const e=EXTRAS.find(x=>x.id===eid); return sum+(e?e.cost:0); },0);
  const toppingLabels = [...b.fruits, ...b.liquids, ...b.solids].map(ingLabel);
  const extraLabels = b.extras.map(id=>{ const e=EXTRAS.find(x=>x.id===id); return (state.lang==='pt'?e.pt:e.en)+' (+'+fmt(e.cost)+')'; });
  state.cart.push({
    key:'acai-'+Date.now(), kind:'acai', label:t('buildYourOwn'), size:b.acaiSize,
    price: sizeInfo.price + extrasCost, toppings:toppingLabels, extras:extraLabels, qty:1
  });
  state.builder = { acaiSize:'M', fruits:[], liquids:[], solids:[], extras:[] };
  persistCart(); toast(t('added')); render();
}

function removeFromCart(key){ state.cart = state.cart.filter(c=>c.key!==key); persistCart(); render(); }
function persistCart(){ lset('okashi-cart-draft', JSON.stringify(state.cart)); }
function cartTotal(){ return state.cart.reduce((s,c)=>s+c.price*c.qty,0); }
function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }
function toggleMulti(arr,id){ const i=arr.indexOf(id); if(i>=0) arr.splice(i,1); else arr.push(id); }
function sumupUrl(total){ return SUMUP_LINK + '?amount=' + total.toFixed(2) + '&currency=EUR'; }

async function finalizeOrder(){
  const id = 'QR' + Date.now().toString(36).toUpperCase().slice(-4);
  const notasParts = [];
  if(state.checkoutName.trim()) notasParts.push('Cliente: ' + state.checkoutName.trim());
  if(state.checkoutNotes.trim()) notasParts.push(state.checkoutNotes.trim());
  if(state.wantsInvoice) notasParts.push('Fatura NIF: ' + state.taxId.trim());
  // Sem "Pagamento:" ainda — a cozinha mostra "NÃO PAGO" até o vendedor confirmar pagamento.
  const fields = {
    'NumeroPedido': id,
    'Hora': new Date().toISOString(),
    'Estado': 'Novo',
    'Itens': buildItemsAirtableText(state.cart),
    'Total': cartTotal(),
    'Notas': notasParts.join(' | '),
    'PedidoPraia': state.fulfil==='beach',
  };
  if(state.fulfil==='beach') fields['OndeEntregar'] = state.beachZone;
  if(state.checkoutPhone.trim()) fields['Telemovel'] = state.checkoutPhone.trim();
  try{
    await airtableFetch(ORDERS_TABLE, 'POST', '', { records:[{ fields }] });
  }catch(e){
    console.error(e);
    toast(state.lang==='pt' ? 'Erro ao enviar pedido. Tenta novamente.' : 'Error sending order. Try again.');
    return;
  }
  const orderData = { id, createdAt:Date.now(), status:'received', paid:false, fulfillment:state.fulfil, beachZone:state.beachZone, customerName:state.checkoutName, wantsInvoice:state.wantsInvoice, taxId:state.taxId, items:state.cart, total:cartTotal() };
  state.myOrders.unshift({id, data:orderData});
  lset('okashi-my-orders', JSON.stringify(state.myOrders.map(o=>o.id)));
  state.cart = []; persistCart();
  state.wantsInvoice = false; state.taxId = '';
  state.cartOpen = false; state.checkoutStage='cart';
  state.confirmationOrder = orderData;
  render();
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

function statusLabel(order){
  if(order.status==='received') return order.paid ? t('statusReceived') : t('awaitingPayment');
  if(order.status==='preparing') return t('statusPreparing');
  if(order.status==='ready') return order.fulfillment==='beach' ? t('statusReadyBeach') : t('statusReadyPickup');
  if(order.status==='completed') return t('statusCompleted');
  return order.status;
}

function stepperHtml(order){
  const labels = [t('statusReceived'), t('statusPreparing'), order.fulfillment==='beach'?t('statusReadyBeach'):t('statusReadyPickup'), t('statusCompleted')];
  const curIdx = STATUS_STEPS.indexOf(order.status);
  return '<div class="stepper">' + labels.map((lab,i)=>{
    let cls='step'; if(i<curIdx) cls+=' done'; else if(i===curIdx) cls+=' current';
    return '<div class="'+cls+'"><div class="step-line"></div><div class="circ">'+(i<curIdx?'✓':(i+1))+'</div><div class="lab">'+lab+'</div></div>';
  }).join('') + '</div>';
}

function giraffeSvg(size){
  const pad = Math.round(size*0.06);
  return '<span style="display:inline-flex;align-items:center;justify-content:center;width:'+size+'px;height:'+size+'px;border-radius:50%;background:#fce98a;overflow:hidden;"><img src="'+LOGO_DATA_URI+'" alt="Okashi Açaí" style="width:'+(size-pad*2)+'px;height:'+(size-pad*2)+'px;object-fit:contain;display:block;"></span>';
}

  else{ main.innerHTML = trackHtml(); bindTrackEvents(); }

function chipGroup(key, idList, selectedArr){
  return `<div class="chip-block">
    <div class="chip-label">${t(key)}</div>
    <div class="chips">${idList.map(id=>`<div class="chip ${selectedArr.includes(id)?'selected':''}" data-topping="${key}|${id}">${ingLabel(id)}</div>`).join('')}</div>
  </div>`;
}

function orderCardHtml(order){
  const when = new Date(order.createdAt).toLocaleString(state.lang==='pt'?'pt-PT':'en-GB',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
  return `<div class="order-card">
    <div class="top"><div class="code">${order.id}</div><div class="when">${when}</div></div>
    <span class="paypill ${order.paid?'confirmed':'pending'}">${order.paid ? '✓ '+ (state.lang==='pt'?'Pago':'Paid') : (state.lang==='pt'?'Pagamento pendente':'Payment pending')}</span>
    ${stepperHtml(order)}
    <div class="order-detail">
      <b>${order.fulfillment==='beach'?t('beach'):t('pickup')}</b>${order.fulfillment==='beach' && order.beachZone ? ' — '+order.beachZone : ''}<br>
      ${order.items ? order.items.map(it=>it.qty+'x '+it.label+' ('+it.size+')').join(', ') : (order.itemsText||'').split('\n').filter(l=>!l.startsWith('+')).map(l=>l.replace(/\s*\(\+€[\d.,]+\)\s*$/,'')).join(', ')}<br>
      <b>${t('total')}: ${fmt(order.total)}</b>
    </div>
  </div>`;
}

function trackHtml(){
  let html = `<div class="lookup-row">
    <input id="lookupInput" placeholder="${t('searchPlaceholder')}" value="${state.lookupCode}">
    <button id="lookupBtn">${t('search')}</button>
  </div>`;
  if(state.lookupResult) html += orderCardHtml(state.lookupResult);
  if(state.lookupError) html += `<div class="empty-note">${state.lookupError}</div>`;

  if(state.myOrders.length===0 && !state.lookupResult){
    html += `<div class="empty-note">${giraffeSvg(56)}<div style="margin-top:10px;">${t('noOrders')}</div></div>`;
  } else {
    html += state.myOrders.map(o=> o.data ? orderCardHtml(o.data) : '').join('');
  }
  return html;
}

function renderCartFab(){
  const existing = document.querySelector('.cart-fab'); if(existing) existing.remove();
  if(cartCount()===0 || state.tab!=='menu') return;
  const btn = document.createElement('button'); btn.className='cart-fab';
  btn.innerHTML = `<div class="l"><span class="badge">${cartCount()}</span>${t('yourCart')}</div><div class="price">${fmt(cartTotal())}</div>`;
  btn.onclick = ()=>{ state.cartOpen=true; state.checkoutStage='cart'; render(); };
  document.getElementById('app').appendChild(btn);
}

      </div>
      <div class="fulfil-opt ${state.fulfil==='beach'?'selected':''} ${canBeach?'':'disabled'}" data-fulfil="${canBeach?'beach':''}">
        <div class="t">${t('beach')}</div><div class="d">${canBeach?'':t('beachUnavailable')}</div>
      </div>
      ${state.fulfil==='beach' ? `<div class="field"><label>${t('beachZoneLabel')}</label>
        <select id="beachZoneInput">
          <option value="">--</option>
          ${BEACH_ZONES.map(z=>`<option value="${z}" ${state.beachZone===z?'selected':''}>${z}</option>`).join('')}
        </select></div>` : ''}
      <div class="field"><label>${t('yourName')}</label><input id="nameInput" value="${state.checkoutName}"></div>
      <div class="field"><label>${t('yourPhone')}</label><input id="phoneInput" value="${state.checkoutPhone}"></div>
      <div class="field"><label>${t('notes')}</label><textarea id="notesInput" rows="2">${state.checkoutNotes}</textarea></div>
      <div class="checkbox-row" id="invoiceToggle">
        <input type="checkbox" id="invoiceCheckbox" ${state.wantsInvoice?'checked':''}>
        <label for="invoiceCheckbox">${t('wantsInvoice')}</label>
      </div>
      ${state.wantsInvoice ? `<div class="field"><label>${t('taxIdLabel')}</label><input id="taxIdInput" inputmode="numeric" maxlength="9" placeholder="${t('taxIdPlaceholder')}" value="${state.taxId}"></div>` : ''}
      <div class="total-row"><div class="lab">${t('total')}</div><div class="val">${fmt(cartTotal())}</div></div>
      <button class="primary-btn" id="goToPaymentBtn" style="border:none;">${t('placeOrder')}</button>
    ` : ''}
  </div>`;
  document.getElementById('app').appendChild(ov);
  ov.querySelector('#closeCart').onclick = ()=>{ state.cartOpen=false; render(); };
  ov.addEventListener('click', e=>{ if(e.target===ov){ state.cartOpen=false; render(); } });
  ov.querySelectorAll('[data-remove]').forEach(b=> b.onclick = ()=> removeFromCart(b.dataset.remove));
  ov.querySelectorAll('[data-fulfil]').forEach(b=> b.onclick = ()=>{ if(b.dataset.fulfil){ state.fulfil=b.dataset.fulfil; render(); } });
  const bz = ov.querySelector('#beachZoneInput'); if(bz) bz.onchange = e=> state.beachZone = e.target.value;
  const ni = ov.querySelector('#nameInput'); if(ni) ni.oninput = e=> state.checkoutName = e.target.value;
  const pi = ov.querySelector('#phoneInput'); if(pi) pi.oninput = e=> state.checkoutPhone = e.target.value;
  const noi = ov.querySelector('#notesInput'); if(noi) noi.oninput = e=> state.checkoutNotes = e.target.value;
  const invCb = ov.querySelector('#invoiceCheckbox'); if(invCb) invCb.onchange = e=>{ state.wantsInvoice = e.target.checked; render(); };
  const taxInput = ov.querySelector('#taxIdInput'); if(taxInput) taxInput.oninput = e=> state.taxId = e.target.value.replace(/\D/g,'').slice(0,9);
  const goBtn = ov.querySelector('#goToPaymentBtn');
  if(goBtn) goBtn.onclick = ()=>{
    if(!state.checkoutName.trim()){ toast(t('nameRequired')); return; }
    if(state.fulfil==='beach' && !state.beachZone){ toast(t('beachZoneRequired')); return; }
    if(state.wantsInvoice && state.taxId.trim().length!==9){ toast(t('taxIdRequired')); return; }
    state.checkoutStage = 'payment'; render();
  };
}

function renderConfirmationOverlay(){
  let ov = document.querySelector('.overlay.confirm-overlay'); if(ov) ov.remove();
  if(!state.confirmationOrder) return;
  const order = state.confirmationOrder;
  ov = document.createElement('div'); ov.className='overlay confirm-overlay open';
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-handle"></div>
    <div class="confirm-code">
      ${giraffeSvg(56)}
      <h2 style="margin:14px 0 2px;">${t('orderConfirmedTitle')}</h2>
      <div style="font-size:.85rem;color:var(--ink-soft);">${t('orderConfirmedSub')}</div>
      <div class="big-code">${order.id}</div>
      <p class="hint">${t('orderConfirmedHint')}</p>
    </div>
    <button class="primary-btn" id="viewOrderBtn" style="border:none;">${t('viewMyOrder')}</button>
  </div>`;
  document.getElementById('app').appendChild(ov);
  ov.querySelector('#viewOrderBtn').onclick = ()=>{ state.confirmationOrder=null; state.tab='track'; render(); };
}

function bindHeaderEvents(){
  document.querySelectorAll('[data-lang]').forEach(b=> b.onclick = ()=>{ state.lang=b.dataset.lang; lset('okashi-lang', state.lang); render(); });
  document.querySelectorAll('[data-tab]').forEach(b=> b.onclick = async ()=>{ state.tab=b.dataset.tab; if(state.tab==='track') await refreshMyOrders(); render(); });
}

function bindMenuEvents(){
  document.querySelectorAll('[data-bowl-size]').forEach(el=> el.onclick = ()=>{ const [id,size]=el.dataset.bowlSize.split('|'); getBowlConfig(id).size=size; render(); });
  document.querySelectorAll('[data-bowl-ing]').forEach(el=> el.onclick = ()=>{ const [id,ing]=el.dataset.bowlIng.split('|'); toggleMulti(getBowlConfig(id).excluded, ing); render(); });
  document.querySelectorAll('[data-bowl-extratop]').forEach(el=> el.onclick = ()=>{
    const [id,ing]=el.dataset.bowlExtratop.split('|'); const cfg=getBowlConfig(id);
    cfg.extraTopping = (cfg.extraTopping===ing) ? null : ing; render();
  });
  document.querySelectorAll('[data-bowl-premium]').forEach(el=> el.onclick = ()=>{ const [id,eid]=el.dataset.bowlPremium.split('|'); toggleMulti(getBowlConfig(id).premium, eid); render(); });
  document.querySelectorAll('[data-add-bowl]').forEach(el=> el.onclick = ()=> addBowlToCart(BOWLS.find(b=>b.id===el.dataset.addBowl)));
  document.querySelectorAll('[data-acai-size]').forEach(el=> el.onclick = ()=>{ state.builder.acaiSize=el.dataset.acaiSize; render(); });
  document.querySelectorAll('[data-topping]').forEach(el=> el.onclick = ()=>{ const [group,id]=el.dataset.topping.split('|'); toggleMulti(state.builder[group], id); render(); });
  document.querySelectorAll('[data-extra]').forEach(el=> el.onclick = ()=>{ toggleMulti(state.builder.extras, el.dataset.extra); render(); });
  const addAcaiBtn = document.querySelector('[data-add-acai]'); if(addAcaiBtn) addAcaiBtn.onclick = addAcaiToCart;
}

function bindTrackEvents(){
  const input = document.getElementById('lookupInput');
  if(input) input.oninput = e=> state.lookupCode = e.target.value;
  const btn = document.getElementById('lookupBtn');
  if(btn) btn.onclick = async ()=>{
    if(!state.lookupCode.trim()) return;
    state.lookupError=''; state.lookupResult=null;
    try{
      const found = await fetchOrderByCode(state.lookupCode);
      if(found) state.lookupResult = found; else state.lookupError = t('orderNotFound');
    }catch(e){ state.lookupError = t('orderNotFound'); }
    render();
  };
}

loadInitial();
</script>
</body>
</html>
