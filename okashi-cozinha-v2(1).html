<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Okashi — Cozinha</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0a1408; color: #fff; min-height: 100vh; }

header {
  background: linear-gradient(135deg, #0a5010, #083808);
  padding: 12px 16px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
}
header h1 { font-size: 18px; font-weight: 800; }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #80ff90; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #4eff70; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.filters {
  display: flex; gap: 7px; padding: 10px 12px;
  background: #0d1a0a; border-bottom: 1px solid #1a3014; overflow-x: auto;
}
.f-btn {
  padding: 6px 14px; border-radius: 20px; border: 1px solid #2a4020;
  background: none; color: #70a060; font-size: 12px; cursor: pointer; white-space: nowrap;
}
.f-btn.active { background: #183010; border-color: #4a9030; color: #c0ffb0; font-weight: 600; }

.stats {
  display: flex; gap: 8px; padding: 8px 12px;
  background: #0d1a0a; border-bottom: 1px solid #1a3014;
}
.stat { font-size: 12px; color: #507040; }
.stat span { font-weight: 700; color: #80c060; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px; padding: 12px;
}

.card { border-radius: 12px; overflow: hidden; border: 2px solid; }
.card.novo { border-color: #e03030; animation: pop .4s ease; }
.card.prep { border-color: #d0a000; }
.card.pronto { border-color: #208040; opacity: 0.65; }
@keyframes pop { 0%{transform:scale(.94);opacity:0} 100%{transform:scale(1);opacity:1} }

.card-head { padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; }
.card-head.novo { background: #3a0808; }
.card-head.prep { background: #2a2000; }
.card-head.pronto { background: #0a2a14; }

.card-num { font-size: 17px; font-weight: 800; }
.badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; }
.badge-novo { background: #e03030; color: #fff; }
.badge-prep { background: #d0a000; color: #000; }
.badge-pronto { background: #208040; color: #fff; }

.card-hora { font-size: 11px; color: #405030; padding: 4px 12px 0; }

.card-body { padding: 8px 12px; border-top: 1px solid #1a2a10; }
.item-line { font-size: 13px; color: #c0e0a0; padding: 2px 0; line-height: 1.4; }
.item-line.main { font-size: 14px; font-weight: 700; color: #e0ffb0; }

.card-notas {
  margin: 4px 12px 8px;
  background: #162010; border-left: 3px solid #4a8030;
  border-radius: 0 6px 6px 0; padding: 5px 8px;
  font-size: 12px; color: #a0d080; font-style: italic;
}

.card-total {
  padding: 7px 12px; border-top: 1px solid #1a2a10;
  display: flex; justify-content: space-between;
}
.total-lbl { font-size: 11px; color: #405030; }
.total-amt { font-size: 16px; font-weight: 800; color: #80ff80; }

.card-actions { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #1a2a10; }
.act-btn {
  flex: 1; padding: 9px 4px; border-radius: 8px; border: none;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.act-btn:active { opacity: 0.75; }
.btn-prep { background: #c09000; color: #000; }
.btn-pronto { background: #1a7030; color: #fff; }
.btn-back { background: #1a2a10; color: #507040; font-size: 11px; }

.empty {
  grid-column: 1/-1; text-align: center;
  padding: 60px 20px; color: #1a3010; font-size: 15px;
}

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #0a3a18; color: #80ff90; padding: 10px 22px;
  border-radius: 20px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🍃 Okashi — Cozinha</h1>
  <div class="live"><div class="dot"></div><span id="live-txt">A ligar...</span></div>
</header>

<div class="filters">
  <button class="f-btn active" id="f-todos" onclick="setFilter('todos')">Todos</button>
  <button class="f-btn" id="f-novo" onclick="setFilter('novo')">🔴 Novos</button>
  <button class="f-btn" id="f-prep" onclick="setFilter('prep')">🟡 Em prep.</button>
  <button class="f-btn" id="f-pronto" onclick="setFilter('pronto')">✅ Prontos</button>
</div>

<div class="stats">
  <div class="stat">Novos: <span id="s-novo">0</span></div>
  <div class="stat">· Em prep.: <span id="s-prep">0</span></div>
  <div class="stat">· Prontos hoje: <span id="s-pronto">0</span></div>
</div>

<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<script>
const TOKEN = 'patmO0sek368PNMKT.6fafae521b0705c64a45a1f4fcfed111baecc9e4910feceeffa2d4914e99e3f3';
const BASE  = 'app1DlNHDekbP5asp';
const TABLE = 'tblQU3C1h4D8mxuqA';

let allOrders = [];
let filter = 'todos';
let knownIds = new Set();
let firstLoad = true;

function setFilter(f) {
  filter = f;
  ['todos','novo','prep','pronto'].forEach(x => document.getElementById('f-'+x).classList.remove('active'));
  document.getElementById('f-'+f).classList.add('active');
  render();
}

function hora(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
}

function parseItems(txt) {
  if (!txt) return [];
  return txt.split('\n').filter(l => l.trim());
}

function render() {
  const grid = document.getElementById('grid');
  const ordem = { Novo:0, 'Em preparacao':1, Pronto:2 };
  let lista = [...allOrders].sort((a,b) => {
    const ae = ordem[a.fields.Estado] ?? 3;
    const be = ordem[b.fields.Estado] ?? 3;
    if (ae !== be) return ae - be;
    return new Date(a.fields.Hora||0) - new Date(b.fields.Hora||0);
  });

  const fMap = { novo:'Novo', prep:'Em preparacao', pronto:'Pronto' };
  if (filter !== 'todos') lista = lista.filter(o => o.fields.Estado === fMap[filter]);

  document.getElementById('s-novo').textContent = allOrders.filter(o => o.fields.Estado === 'Novo').length;
  document.getElementById('s-prep').textContent = allOrders.filter(o => o.fields.Estado === 'Em preparacao').length;
  document.getElementById('s-pronto').textContent = allOrders.filter(o => o.fields.Estado === 'Pronto').length;

  if (!lista.length) {
    grid.innerHTML = '<div class="empty">🍃 Sem pedidos' + (filter !== 'todos' ? ' nesta categoria' : ' de momento') + '</div>';
    return;
  }

  const clsMap = { Novo:'novo', 'Em preparacao':'prep', Pronto:'pronto' };
  const badgeMap = { Novo:'badge-novo', 'Em preparacao':'badge-prep', Pronto:'badge-pronto' };
  const labelMap = { Novo:'Novo', 'Em preparacao':'Em prep.', Pronto:'Pronto' };

  grid.innerHTML = lista.map(o => {
    const f = o.fields;
    const estado = f.Estado || 'Novo';
    const cls = clsMap[estado] || 'novo';
    const items = parseItems(f.Itens);
    const total = f.Total ? '€' + Number(f.Total).toFixed(2) : '';

    const actions = estado === 'Novo'
      ? `<button class="act-btn btn-prep" onclick="mudar('${o.id}','Em preparacao')">Em preparação</button>
         <button class="act-btn btn-back" onclick="mudar('${o.id}','Pronto')" style="max-width:70px">✓ Pronto</button>`
      : estado === 'Em preparacao'
      ? `<button class="act-btn btn-pronto" onclick="mudar('${o.id}','Pronto')">✅ Marcar como pronto</button>`
      : `<button class="act-btn btn-back" onclick="mudar('${o.id}','Em preparacao')">↩ Voltar</button>`;

    return `<div class="card ${cls}">
      <div class="card-head ${cls}">
        <span class="card-num">${f.NumeroPedido || '—'}</span>
        <span class="badge ${badgeMap[estado]}">${labelMap[estado]}</span>
      </div>
      ${f.Hora ? `<div class="card-hora">⏰ ${hora(f.Hora)}</div>` : ''}
      <div class="card-body">
        ${items.map((item,i) => `<div class="item-line ${i===0?'main':''}">${item}</div>`).join('')}
      </div>
      ${f.Notas ? `<div class="card-notas">📝 ${f.Notas}</div>` : ''}
      ${total ? `<div class="card-total"><span class="total-lbl">Total</span><span class="total-amt">${total}</span></div>` : ''}
      <div class="card-actions">${actions}</div>
    </div>`;
  }).join('');
}

async function mudar(id, novoEstado) {
  try {
    const resp = await fetch(`https://api.airtable.com/v0/${BASE}/${TABLE}/${id}`, {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { 'Estado': novoEstado } })
    });
    if (resp.ok) {
      const o = allOrders.find(x => x.id === id);
      if (o) o.fields.Estado = novoEstado;
      render();
    }
  } catch(e) { console.error(e); }
}

function playSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      o.start(ctx.currentTime + i * 0.15);
      o.stop(ctx.currentTime + i * 0.15 + 0.2);
      g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.2);
    });
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function fetch_orders() {
  try {
    const url = `https://api.airtable.com/v0/${BASE}/${TABLE}?sort[0][field]=Hora&sort[0][direction]=desc&maxRecords=50`;
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!resp.ok) { document.getElementById('live-txt').textContent = 'Erro de ligação'; return; }
    const data = await resp.json();
    const records = data.records || [];

    if (!firstLoad) {
      const novos = records.filter(r => !knownIds.has(r.id) && r.fields.Estado === 'Novo');
      if (novos.length) {
        playSound();
        showToast('🔔 ' + novos.length + ' novo(s) pedido(s)!');
      }
    }

    records.forEach(r => knownIds.add(r.id));
    allOrders = records;
    firstLoad = false;

    const now = new Date();
    document.getElementById('live-txt').textContent = now.toLocaleTimeString('pt-PT', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    render();
  } catch(e) {
    document.getElementById('live-txt').textContent = 'Sem ligação';
  }
}

fetch_orders();
setInterval(fetch_orders, 7000);
</script>
</body>
</html>
